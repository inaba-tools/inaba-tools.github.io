<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>フクリ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="フクリ">
<meta name="theme-color" content="#0b0b0c">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" media="(prefers-color-scheme: dark)" href="apple-touch-icon-dark.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=1">
<style>
:root{
  --bg:#eef2f7;--bg2:#dfe7f1;--ink:#0d1520;--sub:#5d6b7c;--mute:#8b97a6;
  --glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.72);--edge:rgba(255,255,255,.85);--line:rgba(15,30,50,.08);
  --up:#0a9b62;--dn:#e0453a;--gold:#c9920f;--blue:#0a6cff;--warn:#e08a00;
  --b1:#7cc7ff;--b2:#ffd76a;--b3:#9fe3c9;
  --shadow:0 10px 30px rgba(20,40,70,.12),0 1px 2px rgba(20,40,70,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#060b12;--bg2:#0b1622;--ink:#f2f6fb;--sub:#9aa8b8;--mute:#6c7a8a;
  --glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.11);--edge:rgba(255,255,255,.16);--line:rgba(255,255,255,.08);
  --up:#3ddc97;--dn:#ff6b5e;--gold:#f3c54a;--blue:#4a9dff;--warn:#ffb340;
  --b1:#1e5f99;--b2:#7a5a10;--b3:#14634a;
  --shadow:0 12px 34px rgba(0,0,0,.45);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{min-height:100dvh}
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,var(--bg2),var(--bg))}
.sky i{position:absolute;border-radius:50%;opacity:.7;animation:drift 22s ease-in-out infinite alternate;will-change:transform}
.sky i:nth-child(1){width:90vw;height:90vw;left:-30vw;top:-20vw;background:radial-gradient(closest-side,var(--b1),transparent)}
.sky i:nth-child(2){width:80vw;height:80vw;right:-35vw;top:30vh;background:radial-gradient(closest-side,var(--b2),transparent);animation-delay:-8s}
.sky i:nth-child(3){width:80vw;height:80vw;left:0;bottom:-35vw;background:radial-gradient(closest-side,var(--b3),transparent);animation-delay:-14s}
/* 上（時計の所）と下（タブの裏）を背景色でなじませる */
.fadeT,.fadeB{position:fixed;left:0;right:0;z-index:3;pointer-events:none}
.fadeT{top:0;height:max(env(safe-area-inset-top),44px);background:var(--bg2)}
.fadeB{bottom:0;height:calc(env(safe-area-inset-bottom) + 90px);background:linear-gradient(transparent,var(--bg) 75%)}
@keyframes drift{to{transform:translate(8vw,6vh) scale(1.12)}}
main{position:relative;z-index:1;min-height:100dvh;
  padding:calc(max(env(safe-area-inset-top),44px) + 48px) 0 calc(env(safe-area-inset-bottom) + 120px)}
.page{display:none;animation:in .35s cubic-bezier(.2,.8,.2,1)}
.page.on{display:block}
@keyframes in{from{opacity:0}to{opacity:1}}
.hd{padding:6px 22px 4px}
.hd .eyebrow{font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.hd h1{margin:2px 0 0;font-size:34px;font-weight:800;letter-spacing:-.02em}
.big{font-size:58px;font-weight:800;letter-spacing:-.045em;line-height:1.02;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.big small{font-size:.42em;font-weight:700;margin-left:2px;letter-spacing:0}
.big .sg{font-size:.6em;margin-right:2px}
.big.up{color:var(--up)}.big.dn{color:var(--dn)}
.cap{font-size:13.5px;color:var(--sub);line-height:1.6}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:26px;
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.35);position:relative;overflow:hidden}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,0) 45%)}
.card{margin:12px 16px;padding:16px 18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chips{display:flex;gap:8px;padding:10px 16px 2px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--sub)}
.chip.on{color:var(--ink);background:var(--glass2)}
.chip b{font-variant-numeric:tabular-nums;margin-left:4px}
.st{display:flex;gap:10px;margin:0 16px}
.st .glass{flex:1;padding:12px 14px;border-radius:20px}
.st small{display:block;font-size:12px;color:var(--sub);font-weight:600}
.st b{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sec{margin:22px 22px 6px;font-size:13px;font-weight:700;color:var(--sub);display:flex;justify-content:space-between}
/* IPOカード */
.ipo .nm{font-size:17px;font-weight:700;line-height:1.35}
.ipo .cd{font-size:12.5px;color:var(--mute);font-weight:600}
.br{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:10px;padding:10px 0 2px;border-top:1px solid var(--line);margin-top:10px}
.br .bn{font-size:12px;font-weight:800;color:var(--sub)}
.steps{display:flex;align-items:center}
.sp{display:flex;flex-direction:column;align-items:center;gap:3px;flex:0 0 auto;min-width:54px}
.sp i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;
  background:var(--line);color:var(--mute)}
.sp span{font-size:11px;font-weight:700;color:var(--mute);white-space:nowrap}
.sp.ok i{background:var(--up);color:#fff}.sp.ok span{color:var(--up)}
.sp.ng i{background:var(--mute);color:#fff}.sp.ng span{color:var(--sub)}
.sp.gold i{background:linear-gradient(135deg,#ffe07a,#d39a12);color:#4a3300}.sp.gold span{color:var(--gold)}
.sp.warn i{background:var(--warn);color:#fff}.sp.warn span{color:var(--warn)}
.sp.now i{box-shadow:0 0 0 4px rgba(10,108,255,.18);background:var(--blue);color:#fff}.sp.now span{color:var(--blue)}
.ln{flex:1;height:2px;background:var(--line);margin:0 -6px 16px;min-width:12px}
.ln.ok{background:var(--up)}
.memo{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:8px;margin-left:6px;vertical-align:2px}
.tag.g{background:rgba(10,155,98,.15);color:var(--up)}.tag.b{background:rgba(224,69,58,.13);color:var(--dn)}.tag.n{background:var(--line);color:var(--sub)}
.empty{text-align:center;color:var(--sub);font-size:14px;line-height:1.8;padding:30px 20px}
/* 予定 */
.day{margin:14px 16px 0}
.day .dl{font-size:13px;font-weight:800;color:var(--sub);margin:0 6px 6px;display:flex;gap:8px;align-items:baseline}
.day .dl b{font-size:22px;color:var(--ink);letter-spacing:-.02em}
.ev{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:12px 16px}
.ev+.ev{border-top:1px solid var(--line)}
.ev .dot{width:10px;height:10px;border-radius:50%}
.ev .t{font-size:15px;font-weight:700;line-height:1.35}
.ev .s{font-size:12px;color:var(--sub);font-weight:600;margin-top:1px}
.ev .r{font-size:12.5px;font-weight:800;text-align:right;white-space:nowrap}
.today{color:var(--blue)}
/* FX */
.live{padding:16px 18px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pl 1.8s infinite}
.pulse.off{background:var(--mute);animation:none}
@keyframes pl{70%{box-shadow:0 0 0 10px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.pos{padding:12px 0;border-top:1px solid var(--line)}
.pos:first-of-type{border-top:0}
.pos .k{font-size:12px;font-weight:800;letter-spacing:.04em}
.k.hold{color:var(--gold)}.k.wait{color:var(--blue)}
.pos .t{font-size:16px;font-weight:700;margin-top:2px}
.pos .w{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.55}
.pos .p{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chart{margin:12px 16px;padding:14px 0 8px;touch-action:none;user-select:none;-webkit-user-select:none}
.chart .top{padding:0 18px;min-height:46px}
.chart .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.chart .d{font-size:12px;color:var(--sub);font-weight:600}
.chart svg{display:block;width:100%;height:180px}
.seg{display:flex;margin:4px 18px 0;padding:3px;border-radius:12px;background:var(--line)}
.seg button{flex:1;border:0;background:none;color:var(--sub);font:700 12.5px/1 inherit;padding:8px 0;border-radius:9px}
.seg button.on{background:var(--glass2);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tr{margin:10px 16px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.tr .a{font-size:15px;font-weight:700}
.tr .b{font-size:12.5px;color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums}
.tr .p{grid-row:1/3;grid-column:2;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-align:right}
.up{color:var(--up)}.dn{color:var(--dn)}
.side{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;margin-right:6px;vertical-align:1px}
.side.buy{background:rgba(10,155,98,.15);color:var(--up)}.side.sell{background:rgba(224,69,58,.13);color:var(--dn)}
/* タブバー（液体ガラス） */
nav.glass{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);
  display:flex;gap:4px;padding:6px;border-radius:999px}
nav button{position:relative;z-index:1;border:0;background:none;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;
  width:72px;padding:8px 0 6px;font:700 11px/1 inherit;border-radius:999px;transition:color .25s}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--blue)}
nav .blob{position:absolute;z-index:0;top:6px;bottom:6px;width:72px;border-radius:999px;background:var(--glass2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 10px rgba(0,0,0,.08);transition:transform .45s cubic-bezier(.3,1.4,.4,1)}
.topbtn{position:fixed;z-index:4;right:16px;top:calc(max(env(safe-area-inset-top),44px) + 10px);width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;border:1px solid var(--edge)}
.topbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.topbtn.bell{right:64px}.topbtn.bell.on svg{fill:var(--gold);stroke:var(--gold)}
.topbtn.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.gate{position:fixed;inset:0;z-index:9;display:none;place-items:center;padding:30px;text-align:center;background:var(--bg)!important;border:0!important;border-radius:0!important}
body.lock main,body.lock nav,body.lock .topbtn,body.lock .fadeB{display:none!important}
.gate.on{display:grid}
.gate::before{display:none}
.gate h2{margin:14px 0 6px}
.gate img{width:96px;height:96px;border-radius:22px;box-shadow:var(--shadow)}
.foot{font-size:11.5px;color:var(--mute);text-align:center;margin:18px 20px;line-height:1.7}
.toast{position:fixed;z-index:8;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-80px);transition:transform .35s;
  padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700}
.toast.on{transform:translate(-50%,0)}
/* 設定 */
.set .row+.row{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.set .t{font-size:15px;font-weight:700}.set .s{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.55}
.btn{border:0;border-radius:14px;padding:11px 16px;font:700 14px/1 inherit;background:var(--blue);color:#fff;white-space:nowrap}
.btn.sub{background:var(--line);color:var(--ink)}
.btn.g{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#1f1f1f;border:1px solid #dadce0}
.btn.g svg{width:18px;height:18px}
.gate .btn{margin-top:14px}

/* ===== テーマD：黒×金（上のぼかしも黒でなじむ） ===== */
:root,:root:not(#x){--bg:#0b0b0c;--bg2:#0b0b0c;--ink:#f2efe8;--sub:#9a958c;--mute:#6e6a63;
  --glass:#161618;--glass2:#1f1f22;--edge:#26262a;--line:#2a2a2e;
  --up:#4ccf8a;--dn:#ff6b5e;--gold:#d6b26a;--blue:#d6b26a;--warn:#e0a040;--shadow:none}
@media (prefers-color-scheme:light){:root{--bg:#0b0b0c;--bg2:#0b0b0c;--ink:#f2efe8;--sub:#9a958c;--mute:#6e6a63;
  --glass:#161618;--glass2:#1f1f22;--edge:#26262a;--line:#2a2a2e;--up:#4ccf8a;--dn:#ff6b5e;--gold:#d6b26a;--blue:#d6b26a;--warn:#e0a040;--shadow:none}}
html,body{background:#0b0b0c!important;color-scheme:dark}
.sky{display:none}
.glass{background:var(--glass);-webkit-backdrop-filter:none;backdrop-filter:none;border:1px solid var(--edge);box-shadow:none;border-radius:14px}
.glass::before{display:none}
main{padding:calc(max(env(safe-area-inset-top),59px) + 34px) 0 calc(env(safe-area-inset-bottom) + 96px)}
.hd{padding:6px 22px 10px}
.hd .eyebrow{color:var(--sub);letter-spacing:.12em;font-size:12px}
.hd h1{font-size:30px}
.chip.on,.seg button.on{background:var(--glass2);color:var(--gold);box-shadow:none}
.sp.now i{background:var(--gold);color:#111;box-shadow:0 0 0 4px rgba(214,178,106,.18)}.sp.now span{color:var(--gold)}
.fadeT{height:max(env(safe-area-inset-top),59px);background:#0b0b0c}
.fadeB{display:none}
/* 下のタブ：画面の下にぴったり付くバー */
nav.glass{left:0;right:0;transform:none;bottom:0;border-radius:0;border:0;border-top:1px solid var(--line);background:rgba(11,11,12,.96);
  padding:6px 0 calc(env(safe-area-inset-bottom) + 4px);justify-content:space-around;gap:0}
nav .blob{display:none}
nav button{width:25%;padding:6px 0 4px;color:var(--mute);font-size:11px}
nav button.on{color:var(--gold)}
nav button svg{width:26px;height:26px}
.topbtn{top:calc(max(env(safe-area-inset-top),59px) + 4px);background:var(--glass)!important;border:1px solid var(--edge)!important;border-radius:50%!important}
.topbtn svg{stroke:var(--ink)}
.toast{background:var(--glass2)!important;color:var(--ink);border:1px solid var(--edge)!important}
.gate{background:#0b0b0c!important}
.btn{background:var(--gold);color:#111}.btn.sub{background:var(--glass2);color:var(--ink)}
#alert{display:none;position:sticky;top:0;z-index:30;margin:calc(env(safe-area-inset-top) + 8px) 12px 0;padding:14px 16px;border-radius:18px;background:#d93025;color:#fff;box-shadow:0 8px 24px rgba(217,48,37,.35)}
#alert.on{display:block}#alert b{display:block;font-size:16px;margin-bottom:4px}#alert .m{font-size:13px;line-height:1.5;opacity:.95;margin-top:4px}
#alert button{margin-top:10px;border:0;border-radius:12px;padding:8px 14px;background:#fff;color:#d93025;font-weight:800;font-size:13px}
.sw{position:relative;width:51px;height:31px;flex:none;border-radius:16px;background:#3a3a3e;border:0;transition:background .2s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--gold)}.sw.on::after{transform:translateX(20px)}
.todo .it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.todo .it:first-of-type{border-top:0;padding-top:4px}
.todo .tt{font-size:15px;font-weight:700;line-height:1.4}.todo .ts{font-size:12.5px;color:var(--sub);margin-top:2px;line-height:1.55}
.todo .w .tt{color:var(--warn)}
.btn.s{padding:9px 12px;font-size:13px;border-radius:12px;text-decoration:none;display:inline-block}
.cash .it{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.cash .it:first-of-type{border-top:0}
.cash b{font-size:20px;font-variant-numeric:tabular-nums}
.set .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
</style>
</head>
<body>
<div class="sky"><i></i><i></i><i></i></div>
<div class="fadeT"></div><div class="fadeB"></div>
<div class="gate glass" id="gate"><div><img src="icon-512.png" alt=""><h2>フクリ</h2><p class="cap" id="gmsg">合い鍵の入ったリンクから開いてください。<br>自分専用のアプリです。</p><div id="gbtn"></div></div></div>
<button class="topbtn glass" id="reload" aria-label="更新"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
<div class="toast glass" id="toast"></div>
<main id="main">
  <section class="page on" id="p-ipo"></section>
  <section class="page" id="p-plan"></section>
  <section class="page" id="p-fx"></section>
  <section class="page" id="p-set"></section>
</main>
<nav class="glass" id="nav">
  <div class="blob" id="blob"></div>
  <button data-p="ipo" class="on"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="19" cy="17" r="2"/></svg>申込</button>
  <button data-p="plan"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>予定</button>
  <button data-p="fx"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 8-8M15 7h5v5"/></svg>FX</button>
  <button data-p="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M2.5 12h3M18.5 12h3M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>設定</button>
</nav>
<script>
const VERSION='13';
const CLIENT_ID='187861904258-0eilchk073j1hbginl1hncskf7jpp4ja.apps.googleusercontent.com';  // GoogleログインのクライアントID（公開してよい値）
const VAPID='BFPiiQbgaxGzyfVZaA--hO4tmo7iamPgNVKypX8MHbwrcy3IF3d3544WBQX1cVLJmfDnfnRuZaPrTR9KNwHJlyc';
const API='https://script.google.com/macros/s/AKfycbwTnqvwT5kAsd0AKqWztPr5yxcw4FKEM4ISuuMwrtFsUGmYTjdeAzXfhypG1TIj_B7d/exec';
const KD='../kabu-drop/data/';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yen=v=>Math.abs(Math.round(v)).toLocaleString('ja-JP');
const pm=v=>(v>=0?'+':'−')+yen(v)+'円';
const brk=s=>esc(s).replace(/。(?!$)/g,'。<br>');
const W='日月火水木金土';

// 合い鍵：リンクの #k=… から受け取り、そのままURLに残す（ホーム画面に追加しても使える）

function gLogin(){
  if(!CLIENT_ID){toast('Googleログインはまだ準備中です');return}
  const n=crypto.getRandomValues(new Uint32Array(4)).join('');store.set('fk_nonce',n);
  const u=new URL('https://accounts.google.com/o/oauth2/v2/auth');
  Object.entries({client_id:CLIENT_ID,response_type:'id_token',scope:'openid email',redirect_uri:location.origin+location.pathname,nonce:n,state:n,prompt:'select_account'}).forEach(([k,v])=>u.searchParams.set(k,v));

const BRS=['SBI','楽天','DMM'];
function judge(code){
  const o=KDD.ipo.find(x=>x.code===code)||{};const y=KDD.yoso[code]||{};
  const num=s=>{const v=parseFloat(String(s||'').replace(/[,円]/g,''));return isNaN(v)?null:v};
  let hi=null;if(o.data3&&o.data3.includes('～'))hi=num(o.data3.split('～')[1]);
  const base=num(o.data10)||hi||y.sotei;const p=y.last||y.bb||y.reader;
  if(y.rank==='D')return{j:'bad',rank:y.rank};
  if(!p||!base)return{j:null,rank:y.rank};
  return{j:p>base?'good':'bad',rank:y.rank,gain:Math.round((p-base)*100)};
}
function renderIPO(){
  const el=$('#p-ipo');const rows=(D&&D.ipo)||[];
  const g={};rows.forEach(r=>{const[b,code,name,kind,a,at,l,lt,bu,bt,m]=r;(g[code]=g[code]||{code,name,kind,br:{}}).br[b]={a,at,l,lt,bu,bt,m};if(name)g[code].name=name});
  const list=Object.values(g).filter(x=>Object.values(x.br).some(v=>v.a&&v.a!=='見送り'||v.l||v.bu));
  const cnt=k=>rows.filter(r=>k(r)).length;
  const won=cnt(r=>/当選/.test(r[6])),bought=cnt(r=>r[8]==='購入済'),applying=cnt(r=>r[4]==='申込済'&&!r[6]);
  const gainAll=list.reduce((s,x)=>s+Object.values(x.br).filter(v=>v.bu==='購入済').length*((judge(x.code).gain)||0),0);
  const run=((D&&D.runs)||[]).find(r=>r[1]!=='警告')||[];
  let h=`<div class="hd"><div class="eyebrow">自動化IPO・分売</div><h1>申込</h1>
   <div class="big">${applying}<small>件 抽選待ち</small></div>
   <div class="cap">${run[0]?`前回の自動実行：${esc(run[0].slice(5,16).replace('-','/').replace('T',' '))}（${esc(run[1])}）`:'まだ記録がありません。'}</div></div>
   <div class="st"><div class="glass"><small>当選</small><b class="${won?'up':''}">${won}</b></div><div class="glass"><small>購入済</small><b>${bought}</b></div>
   <div class="glass"><small>見込みの利益</small><b class="${gainAll>0?'up':''}" style="font-size:20px">${gainAll?pm(gainAll):'—'}</b></div></div>`;
  h+=todoCard(rows)+cashCard();
  if(!list.length)h+=`<div class="empty">まだ申込の記録がありません。<br>毎日21時に自動で申し込みます。</div>`;
  else{
    list.sort((a,b)=>stage(b)-stage(a));
    h+=`<div class="sec"><span>銘柄ごとの進み具合</span><span>${list.length}銘柄</span></div>`;
    h+=list.map(x=>{const J=judge(x.code);const o=KDD.ipo.find(i=>i.code===x.code)||{};
      const tag=J.j==='good'?`<span class="tag g">得 ${J.gain?'+'+yen(J.gain)+'円':''}</span>`:J.j==='bad'?'<span class="tag b">損の予想</span>':'<span class="tag n">予想なし</span>';
      const sub=[x.code,o.data15?'抽選 '+md(o.data15):'',o.data18?'上場 '+md(o.data18):''].filter(Boolean).join('・');
      return `<div class="glass card ipo"><div class="nm">${esc(x.name||x.code)}${tag}</div><div class="cd">${esc(sub)}</div>
        ${Object.entries(x.br).sort((a,b)=>BRS.indexOf(a[0])-BRS.indexOf(b[0])).map(([b,v])=>brRow(b,v)).join('')}</div>`}).join('');
  }
  const byM={};rows.filter(r=>r[8]==='購入済').forEach(r=>{const g=judge(r[1]).gain;if(g==null)return;const m=String(r[9]||'').slice(0,7)||'不明';byM[m]=(byM[m]||0)+g});

  h+=`<div class="foot">SBI・楽天は全部のIPOに申し込み、当選したら「得」の予想のときだけ購入します。<br>DMMは「得」の予想だけ申し込みます。</div>`;
  el.innerHTML=h;

// ---------- 次にやること・口座のお金 ----------
const DEP={SBI:'https://www.sbisec.co.jp/ETGate',楽天:'https://www.rakuten-sec.co.jp/ITS/V_ACT_Login.html',DMM:'https://kabu.dmm.com/'};
const BKEY={SBI:'sbi',楽天:'rakuten',DMM:'dmm'};
function todoCard(rows){
  const S=(D&&D.status)||{},RS=(D&&D.resume)||[],it=[];
  Object.entries(S.paused||{}).forEach(([b,m])=>{const w=RS.includes(BKEY[b]);
    it.push({w:1,t:`${b}の自動処理が止まっています`,s:w?'再開の予約済み。次の12時か21時の実行から動きます。':'ログインに失敗したので止めました。パスワード等を確かめてから再開してください。',
      b:w?'':`<button class="btn s" onclick="resume('${BKEY[b]}','${b}')">再開</button>`})});
  let money=(S.money||[]);
  if(!S.at){const run=((D&&D.runs)||[]).find(r=>r[1]!=='警告')||[];
    if(run[2]&&/【入金が必要】/.test(run[2])&&Date.now()-new Date(run[0])<2*864e5)money=String(run[2]).split('【入金が必要】')[1].split('／')}
  money.forEach(m=>{const b=(m.match(/^(SBI|楽天|DMM)/)||[])[1];
    it.push({w:1,t:'入金してください',s:m,b:b&&DEP[b]?`<a class="btn s" href="${DEP[b]}" target="_blank" rel="noopener">${b}で入金</a>`:''})});
  rows.filter(r=>r[8]==='要対応').forEach(r=>it.push({w:1,t:`${r[0]} ${r[2]}を手で購入`,s:r[10]||'',b:DEP[r[0]]?`<a class="btn s" href="${DEP[r[0]]}" target="_blank" rel="noopener">開く</a>`:''}));
  // これからの抽選（3日以内・自分が申し込んだもの）
  const now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const Pd=s=>{const m=String(s||'').match(/(\d+)[\/-](\d+)[\/-](\d+)/);return m?new Date(+m[1],m[2]-1,+m[3]):null};
  const mine={};rows.filter(r=>r[4]==='申込済'&&!r[6]).forEach(r=>{(mine[r[1]]=mine[r[1]]||[]).push(r[0])});
  KDD.ipo.forEach(o=>{if(!mine[o.code])return;const d=Pd(o.data15||o.data9);if(!d)return;const n=Math.round((d-t0)/864e5);
    if(n>=0&&n<=3)it.push({t:`${n===0?'今日':n===1?'明日':(d.getMonth()+1)+'/'+d.getDate()} 18時に抽選`,s:`${o.data1||o.code}（${mine[o.code].join('・')}）。当選したら自動で購入まで進めます。`})});
  const body=it.length?it.map(x=>`<div class="it ${x.w?'w':''}"><div><div class="tt">${esc(x.t)}</div><div class="ts">${brk(x.s)}</div></div>${x.b||''}</div>`).join('')
    :'<div class="ts" style="padding:4px 0">今やることはありません。<br>全部自動で進んでいます。</div>';
  return `<div class="sec"><span>次にやること</span><span>${it.filter(x=>x.w).length?'対応が必要':''}</span></div><div class="glass card todo" ${it.some(x=>x.w)?'style="border-color:var(--warn)"':''}>${body}</div>`;
}
function cashCard(){
  const c=((D&&D.status)||{}).cash||{};const ks=['SBI','楽天','DMM'].filter(k=>c[k]);
  if(!ks.length)return `<div class="sec"><span>口座のお金</span></div><div class="glass card cash"><div class="ts" style="font-size:12.5px;color:var(--sub)">毎日12時と21時の確認のあとに出ます。</div></div>`;
  const tot=ks.reduce((a,k)=>a+(+c[k].yen||0),0);
  return `<div class="sec"><span>口座のお金（買付余力）</span><span>合計 ${yen(tot)}円</span></div><div class="glass card cash">${ks.map(k=>`<div class="it"><div><div style="font-weight:700">${k}</div><div style="font-size:12px;color:var(--sub)">${esc(String(c[k].at).slice(5,16).replace('-','/').replace('T',' '))} 時点</div></div><div style="display:flex;align-items:center;gap:10px"><b>${yen(c[k].yen)}円</b><a class="btn s sub" href="${DEP[k]}" target="_blank" rel="noopener">入金</a></div></div>`).join('')}</div>`;
}
async function resume(b,jp){
  if(!confirm(jp+'の自動処理を再開しますか？\nパスワード等を直してから押してください。'))return;
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({kind:'resume',key:KEY,sess:SESS,broker:b})}).then(r=>r.json());
    if(!r.ok)throw 0;toast('再開を予約しました');load();
  }catch(_){toast('再開できませんでした')}
}
function stage(x){return Math.max(...Object.values(x.br).map(v=>v.bu==='要対応'?9:/当選/.test(v.l)&&!v.bu?8:v.bu==='購入済'?6:v.a==='申込済'&&!v.l?5:v.l?2:1))}
function md(s){const m=String(s).match(/(\d+)\/(\d+)\/(\d+)/);return m?`${+m[2]}/${+m[3]}`:s}
function brRow(b,v){
  const s1=v.a==='申込済'||v.a==='試運転'?'ok':v.a==='見送り'?'ng':'';
  const s2=/当選/.test(v.l)?'gold':v.l?'ng':s1==='ok'?'now':'';
  const s3=v.bu==='購入済'?'ok':v.bu==='辞退'?'ng':v.bu==='要対応'?'warn':/当選/.test(v.l)?'now':'';
  const t1=v.a||'申込',t2=v.l||'抽選',t3=v.bu||'購入';
  const ic=(s,n)=>s==='ok'||s==='gold'?'✓':s==='ng'?'–':s==='warn'?'!':n;
  return `<div class="br"><div class="bn">${esc(b)}</div><div><div class="steps">
    <div class="sp ${s1}"><i>${ic(s1,1)}</i><span>${esc(t1)}</span></div><div class="ln ${s1==='ok'&&v.l?'ok':''}"></div>
    <div class="sp ${s2}"><i>${s2==='gold'?'★':ic(s2,2)}</i><span>${esc(t2)}</span></div><div class="ln ${v.bu?'ok':''}"></div>
    <div class="sp ${s3}"><i>${ic(s3,3)}</i><span>${esc(t3)}</span></div></div>
    ${v.m&&v.a!=='申込済'?`<div class="memo">${brk(v.m)}</div>`:''}</div></div>`;
}

function trades(){
  return ((D&&D.fx&&D.fx.trades)||[]).map(r=>({d:String(r[0]).slice(0,10),t:String(r[1]),side:String(r[2]),it:String(r[3]).slice(-8,-3)||r[3],ip:+r[4],ot:r[5],op:+r[6],why:String(r[7]||''),p:+r[8]||0,mode:r[9]}))
    .filter(x=>x.d&&!isNaN(x.p)).sort((a,b)=>(a.d+a.ot)<(b.d+b.ot)?-1:1);
}
function tm(v){const s=String(v);const m=s.match(/T(\d\d:\d\d)/)||s.match(/^(\d{1,2}:\d\d)/);return m?m[1]:s}
function renderFX(){
  const el=$('#p-fx');const T=trades();const N=(D&&D.fx&&D.fx.now)||{};
  const cut={'7':7,'30':30,'all':99999}[FXR];const lim=new Date(Date.now()-cut*864e5).toISOString().slice(0,10);
  const R=T.filter(x=>x.d>=lim);const tot=R.reduce((s,x)=>s+x.p,0);
  const win=R.filter(x=>x.p>0).length;
  const live=N.at&&(Date.now()-new Date(N.at+':00+09:00'))<10*60e3;
  const open=(N.pos||[]).reduce((s,x)=>s+(x.p||0),0);
  let h=`<div class="hd"><div class="eyebrow">自動化FX・${esc(N.mode||'練習')}</div><h1>FX</h1>
    <div class="big ${tot>=0?'up':'dn'}"><span class="sg">${tot>=0?'+':'−'}</span>${yen(tot)}<small>円</small></div>
    <div class="cap">${R.length}回の取引で${win}勝${R.length-win}敗。<br>${FXR==='all'?'練習を始めてからの合計':'直近'+FXR+'日の合計'}です。</div></div>`;
  h+=`<div class="seg">${[['7','7日'],['30','30日'],['all','全部']].map(([k,t])=>`<button data-r="${k}" class="${FXR===k?'on':''}">${t}</button>`).join('')}</div>`;
  // 今の動き
  h+=`<div class="glass card live"><div class="row"><div style="display:flex;align-items:center;gap:8px;font-weight:800">
    <i class="pulse ${live?'':'off'}"></i>${live?'いまの動き':'botの合図が止まっています'}</div>
    <div class="cap">${N.at?esc(N.at.slice(11,16))+' 時点':''}</div></div>`;
  if(N.stop)h+=`<div class="memo" style="color:var(--dn)">損の上限で止まっています（新しくは入りません）。</div>`;
  (N.pos||[]).forEach(x=>{h+=`<div class="pos"><div class="row"><div><div class="k hold">● 持っている</div>
    <div class="t"><span class="side ${x.side==='買い'?'buy':'sell'}">${esc(x.side)}</span>${esc(x.t)}</div>
    <div class="w">${esc(x.at)}に${fmtPx(x.in)}で入った。<br>今は${fmtPx(x.cur)}・${esc(x.out)}に決済。</div></div>
    <div class="p ${x.p>=0?'up':'dn'}">${x.p==null?'—':pm(x.p)}</div></div></div>`});
  (N.wait||[]).forEach(x=>{h+=`<div class="pos"><div class="k wait">○ 待っている</div><div class="t">${esc(x.t)}</div><div class="w">${brk(x.w)}</div></div>`});
  if(!N.at)h+=`<div class="memo">botから最初の合図が届くと、ここに今の状態が出ます。</div>`;
  if((N.pos||[]).length)h+=`<div class="memo">決済前の損益（含み）：<b class="${open>=0?'up':'dn'}">${pm(open)}</b></div>`;
  h+=`</div>`;
  // グラフ
  h+=`<div class="glass chart" id="chart"><div class="top"><div class="v" id="cv"></div><div class="d" id="cd"></div></div><svg id="cs" preserveAspectRatio="none"></svg></div>`;
  // 取引カード
  h+=`<div class="sec"><span>取引</span><span>新しい順</span></div>`;
  h+=R.slice().reverse().slice(0,80).map(x=>{const dd=new Date(x.d+'T00:00:00');
    return `<div class="glass tr"><div class="a"><span class="side ${x.side==='買い'?'buy':'sell'}">${esc(x.side)}</span>${esc(x.t)}</div>
    <div class="p ${x.p>=0?'up':'dn'}">${pm(x.p)}</div>
    <div class="b">${dd.getMonth()+1}/${dd.getDate()}（${W[dd.getDay()]}） ${esc(tm(x.it))} ${fmtPx(x.ip)} → ${esc(tm(x.ot))} ${fmtPx(x.op)}<br>${esc(x.why.replace(/（入る時.*?）/,''))}</div></div>`}).join('')||'<div class="empty">まだ取引がありません。</div>';
  h+=`<div class="foot">練習モードは本物のお金を使わない記録です。<br>1万通貨・手数料込みの金額です。</div>`;
  el.innerHTML=h;
  el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{FXR=b.dataset.r;store.set('fk_fxr',FXR);renderFX()});
  drawChart(R);
}
function fmtPx(v){v=+v;if(!v)return'—';return v<10?v.toFixed(5):v.toFixed(3)}
function drawChart(R){
  const svg=$('#cs');if(!svg)return;const w=svg.clientWidth||340,h=180,pad=14;
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  const pts=[{d:'',v:0}];let s=0;R.forEach(x=>{s+=x.p;pts.push({d:x.d,v:s,x})});
  if(pts.length<2){svg.innerHTML='';$('#cv').textContent='—';$('#cd').textContent='取引がたまるとグラフが出ます。';return}
  const vs=pts.map(p=>p.v),mx=Math.max(0,...vs),mn=Math.min(0,...vs),rg=(mx-mn)||1;
  const X=i=>pad+(w-pad*2)*i/(pts.length-1),Y=v=>pad+(h-pad*2)*(1-(v-mn)/rg);
  const up=s>=0,col=up?'var(--up)':'var(--dn)';
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  svg.innerHTML=`<defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${up?'#3ddc97':'#ff6b5e'}" stop-opacity=".35"/><stop offset="1" stop-color="${up?'#3ddc97':'#ff6b5e'}" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pad}" x2="${w-pad}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="${d} L${X(pts.length-1)} ${h} L${X(0)} ${h} Z" fill="url(#fg)"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <line id="cx" y1="0" y2="${h}" stroke="var(--sub)" stroke-width="1" opacity="0"/><circle id="cc" r="6" fill="${col}" stroke="#fff" stroke-width="2.5" opacity="0"/>`;
  const show=i=>{const p=pts[i];$('#cv').innerHTML=`<span class="${p.v>=0?'up':'dn'}">${pm(p.v)}</span>`;
    $('#cd').textContent=p.x?`${md(p.d.replace(/-/g,'/'))} ${p.x.t}（${pm(p.x.p)}）までの合計`:'はじめ';
    const cx=$('#cx'),cc=$('#cc');cx.setAttribute('x1',X(i));cx.setAttribute('x2',X(i));cx.setAttribute('opacity',.5);cc.setAttribute('cx',X(i));cc.setAttribute('cy',Y(p.v));cc.setAttribute('opacity',1)};
  const reset=()=>{$('#cv').innerHTML=`<span class="${s>=0?'up':'dn'}">${pm(s)}</span>`;$('#cd').textContent='指でなぞると、その時点の合計が出ます。';$('#cx').setAttribute('opacity',0);$('#cc').setAttribute('opacity',0)};
  reset();
  const box=$('#chart');let last=-1;
  const mv=e=>{const r=svg.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const i=Math.max(0,Math.min(pts.length-1,Math.round((cx/r.width*w-pad)/((w-pad*2)/(pts.length-1)))));
    if(i!==last){last=i;show(i);if(navigator.vibrate)try{navigator.vibrate(4)}catch(_){}}};
  box.ontouchstart=e=>{mv(e)};box.ontouchmove=e=>{e.preventDefault();mv(e)};box.ontouchend=()=>{last=-1;reset()};
  box.onpointermove=e=>{if(e.pointerType==='mouse')mv(e)};box.onpointerleave=()=>reset();
}

// ---------- 画面の切り替え ----------
function renderSet(){
  const el=$('#p-set');if(!el)return;
  const g=SESS?`<div class="t">ログイン中<span class="tag g">ON</span></div><div class="s">${esc(GMAIL)}<br>合い鍵＋Googleログインの二重で守っています。</div>`
    :`<div class="t">Googleログイン<span class="tag n">${GON?'必要':'未設定'}</span></div><div class="s">ログインすると、合い鍵だけでは開けなくなります。<br>自分のアカウントだけが開けるようになります。</div>`;
  el.innerHTML=`<div class="hd"><div class="eyebrow">フクリ</div><h1>設定</h1></div>
   <div class="sec">アカウント</div>
   <div class="card glass set"><div class="row"><div>${g}</div></div>
    <div style="margin-top:14px">${SESS?'<button class="btn sub" onclick="gLogout()">ログアウト</button>':`<button class="btn g" onclick="gLogin()">${GICON}Googleでログイン</button>`}</div></div>
   <div class="sec">通知</div>
   <div class="card glass set"><div class="row"><div><div class="t">アプリへの通知</div><div class="s">${BELL?'当選・購入・入金不足などの知らせが届きます。':'オフです。<br>ホーム画面に追加したフクリでオンにしてください。'}</div></div><button class="sw ${BELL?'on':''}" aria-label="通知のオンオフ" onclick="${BELL?'bellOff()':'bellOn()'}"></button></div></div>
   <div class="sec">安全</div>
   <div class="card glass set"><div><div class="t">合い鍵を作り直す</div><div class="s">合い鍵のリンクが漏れたかもと思ったら押してください。<br>古いリンクは使えなくなり、ほかの端末のログインも切れます。</div></div>
    ${SESS?'<div style="margin-top:14px"><button class="btn sub" onclick="rekey()">合い鍵を作り直す</button></div>':''}</div>
   <div class="foot">ver.${VERSION}</div>`;
}
function render(){renderIPO();renderPlan();renderFX();renderSet()}
function go(p){TAB=p;store.set('fk_tab',p);
  document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on',e.id==='p-'+p));
  const bs=[...document.querySelectorAll('nav button')];bs.forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  const i=bs.findIndex(b=>b.dataset.p===p);$('#blob').style.transform=`translateX(${i*76}px)`;window.scrollTo(0,0);
  if(p==='fx'&&D)drawChart(trades().filter(x=>x.d>=new Date(Date.now()-({'7':7,'30':30,'all':99999}[FXR])*864e5).toISOString().slice(0,10)))}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));
$('#reload').onclick=()=>load(true);

// ---------- 通知（フクリのアプリに届く） ----------
let swReg=null,BELL=false;
const b64=s=>{const p='='.repeat((4-s.length%4)%4);const r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
async function bellState(){let on=false;try{const r=swReg||await navigator.serviceWorker.getRegistration();on=!!(r&&await r.pushManager.getSubscription())&&Notification.permission==='granted'}catch(_){}BELL=on;renderSet();return on}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(r=>{swReg=r;bellState()}).catch(()=>{});
navigator.serviceWorker&&navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.tab)go(e.data.tab)});
async function rekey(){
  if(!confirm('合い鍵を作り直しますか？\n古いリンクは使えなくなります。'))return;
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({kind:'rekey',key:KEY,sess:SESS})}).then(r=>r.json());
    if(!r.ok||!r.key)throw 0;KEY=r.key;store.set('fk_key',KEY);history.replaceState(null,'','#k='+KEY);
    const link=location.origin+location.pathname+'#k='+KEY;try{await navigator.clipboard.writeText(link)}catch(_){}
    toast('作り直しました（新しいリンクをコピー）');
  }catch(_){toast('作り直せませんでした')}
}
async function bellOff(){
  try{const r=swReg||await navigator.serviceWorker.getRegistration();const sub=r&&await r.pushManager.getSubscription();if(sub)await sub.unsubscribe();toast('通知をオフにしました')}catch(_){toast('オフにできませんでした')}
  bellState();
}
async function bellOn(){
  const sa=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  if(!('PushManager' in window)||!sa){toast('ホーム画面に追加したフクリから押してください');return}
  try{
    if(await Notification.requestPermission()!=='granted'){toast('通知が許可されませんでした');return}
    const r=swReg||await navigator.serviceWorker.ready;let sub=await r.pushManager.getSubscription();
    if(!sub)sub=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID)});
    const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({kind:'sub',key:KEY,sess:SESS,sub:sub.toJSON()})}).then(r=>r.json());
    if(!res.ok)throw 0;toast('通知がつながりました');bellState();
  }catch(e){toast('通知の登録に失敗しました')}
}
{const q=new URLSearchParams(location.search).get('tab');if(q)store.set('fk_tab',q),TAB=q}

// 前回の中身をすぐ出してから最新を読む
if(KEY&&!SESS&&!location.hash.includes('id_token'))needLogin();
if(SESS){try{const c=JSON.parse(store.get('fk_cache')||'null');if(c){D=c.D;KDD=c.KDD;render()}}catch(_){}}
renderSet();go(TAB);gReturn().then(()=>{if(SESS)load()});
setInterval(()=>{if(!document.hidden&&TAB==='fx')load()},60000);
// 更新の自動反映：新しい版が出ていたら読み直す
async function checkVer(){try{const v=(await fetch('version.txt?t='+Date.now(),{cache:'no-store'}).then(r=>r.text())).trim();if(v&&v!==VERSION)location.reload()}catch(_){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkVer();if(SESS)load()}});
checkVer();
</script>
