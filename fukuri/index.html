<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>フクリ</title>
<style>body{background:#000;color:#ddd;font-family:-apple-system,sans-serif;display:grid;place-items:center;height:100vh;margin:0;text-align:center;line-height:1.9;padding:0 24px}a{display:inline-block;margin-top:20px;padding:16px 28px;border-radius:14px;background:#8b5cf6;color:#fff;text-decoration:none;font-weight:700;font-size:18px}</style></head><body><div id="m"></div>
<script>
var k=(location.hash.match(/(?:^#|&)k=([A-Za-z0-9-]+)/)||[])[1];try{k=k||localStorage.getItem('fk_key')}catch(e){}
var m=document.getElementById('m');
if(k){m.innerHTML='フクリは新しい場所に移りました。<br>下のボタンでSafariが開きます。<br>開いた画面で「ホーム画面に追加」してください。<br><a target="_blank" rel="noopener" href="https://owl-ledger-7k.github.io/#k='+k+'">新しいフクリを開く</a>'}
else{m.textContent='このページは終了しました。'}
</script></body></html>
