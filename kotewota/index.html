<style>
:root{--bg:#F6F7F5;--ink:#1c1c1e;--sub:#6b6f6b;--green:#2E7D4F;--deep:#1F3D2B;--yellow:#F5D33B;--line:#dfe3df;--card:#fff}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:440px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 18px calc(env(safe-area-inset-bottom) + 12px)}
.top{display:flex;align-items:center;font-size:11px;color:var(--sub);height:22px}
.top .back{font-size:13px;color:var(--green);font-weight:600;padding:4px 8px 4px 0;visibility:hidden}
.top .pr{margin-left:auto}
.hero{display:flex;align-items:flex-end;gap:10px;margin-top:6px}
.hero img{width:64px;height:64px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.1);flex:none}
.bub{position:relative;flex:1;min-width:0;background:#fff;border-radius:18px;padding:11px 14px;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.bub:after{content:'';position:absolute;left:-7px;bottom:12px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.bub b{display:block;font-size:19px;font-weight:700;line-height:1.35;letter-spacing:-.2px}
.bub small{display:block;font-size:12px;color:var(--sub);margin-top:2px;white-space:pre-line}
.bar{display:flex;gap:6px;margin:14px 0 4px}.bar i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .3s}.bar i.on{background:var(--green)}
.body{flex:1;min-height:0;position:relative}
.step{position:absolute;inset:0;padding-top:12px;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none;opacity:0;transform:translateX(24px);pointer-events:none;transition:opacity .25s,transform .25s}
.step::-webkit-scrollbar{display:none}
.step.now{opacity:1;transform:none;pointer-events:auto}
.step.gone{transform:translateX(-24px)}
.g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}
.t{background:var(--card);border-radius:15px;min-height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:15px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06);text-align:left;transition:transform .1s}
.t:active{transform:scale(.97)}
.t i{width:11px;height:11px;border-radius:50%;flex:none}
.t.on{outline:2px solid var(--green);background:#EEF7F1}
.t.u{grid-column:1/3;background:transparent;box-shadow:none;border:1.5px dashed #c9cec9;justify-content:center;color:var(--sub);font-weight:500}
.t.u.on{border-color:var(--green);color:var(--green);outline:0;background:#EEF7F1}
.big{display:flex;flex-direction:column;gap:9px}
.big .t{min-height:64px;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding:10px 16px}
.big .t span{font-size:16px}.big .t em{font-style:normal;font-size:12px;color:var(--sub);font-weight:400}
.lab{font-size:13px;font-weight:600;color:var(--sub);margin:2px 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chips .t{min-height:40px;padding:0 13px;font-size:14px;border-radius:12px}
.own{margin-top:12px;font-size:13px;color:var(--green);font-weight:600;align-self:flex-start;padding:4px 0}
.ownbox{display:none;margin-top:6px;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:8px 12px;font-size:14px}
.ownbox.show{display:flex}
.ownbox input{flex:1;min-width:0;font:inherit;font-size:17px;font-weight:600;border:0;outline:0;text-align:right;background:transparent}
.help{margin-top:10px;font-size:12px;color:var(--sub);line-height:1.6;white-space:pre-line}
/* 結果 */
.res{gap:9px}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.06);overflow:hidden}
.card>button{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;text-align:left}
.card .ic{width:34px;height:34px;border-radius:10px;background:#EEF7F1;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.card .nm{font-size:13px;color:var(--sub)}.card .nm b{display:block;font-size:15px;color:var(--ink)}
.card .sv{margin-left:auto;text-align:right;font-size:12px;color:var(--sub)}.card .sv b{display:block;font-size:17px;color:var(--green)}
.card .sv b.zero{color:var(--sub);font-size:14px}
.card .in{display:none;padding:0 14px 14px;font-size:13px;line-height:1.6;color:#3a3d3a}
.card.open .in{display:block}
.card .in p{white-space:pre-line}
.go{display:flex;align-items:center;justify-content:center;margin-top:10px;height:46px;border-radius:12px;background:var(--yellow);color:var(--deep);font-weight:700;font-size:15px;text-decoration:none}
.go.sub{background:#EEF7F1;color:var(--green);height:40px;font-size:14px;margin-top:8px}
.note{font-size:10.5px;color:#8e928e;line-height:1.55;margin-top:auto;padding:8px 0 4px;white-space:pre-line}
.res>*{flex:none}
.again{font-size:13px;color:var(--green);font-weight:600;padding:6px 0;align-self:center}
/* 下の帯 */
.foot{margin-top:10px;background:var(--deep);color:#fff;border-radius:20px;padding:13px 14px 13px 18px;display:flex;align-items:center;flex:none}
.foot small{font-size:12px;opacity:.75;display:block}
.foot .num{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.15}.foot .num em{font-style:normal;font-size:14px;margin-left:2px}
.foot .nx{margin-left:auto;background:var(--yellow);color:var(--deep);font-weight:700;font-size:15px;padding:11px 18px;border-radius:12px;transition:opacity .2s}
.foot .nx:disabled{opacity:.35}
@media (max-height:700px){.hero img{width:52px;height:52px}.bub b{font-size:17px}.t{min-height:46px}.big .t{min-height:56px}.chips .t{min-height:36px}.foot .num{font-size:23px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><button class="back" id="back">‹ 戻る</button><span class="pr">このページには広告（PR）を含みます</span></div>
  <div class="hero"><img src="icon-192.png?v=2" alt="コテヲタ"><div class="bub"><b id="q">スマホ、どこの使ってる？</b><small id="qs">タップするだけ。
明細はいらないよ</small></div></div>
  <div class="bar" id="bar"><i class="on"></i><i></i><i></i><i></i></div>

  <div class="body">
    <!-- 1 スマホ会社 -->
    <section class="step now" data-s="0">
      <div class="g" id="carriers"></div>
    </section>

    <!-- 2 使い方 -->
    <section class="step" data-s="1">
      <div class="big" id="usage"></div>
      <button class="own" id="ownBtn">今の月額がわかる人は入れる ›</button>
      <div class="ownbox" id="ownBox">1人・1か月<input id="ownPhone" inputmode="numeric" placeholder="わからなければ空のまま">円</div>
    </section>

    <!-- 3 家のネット -->
    <section class="step" data-s="2">
      <div class="big" id="home"></div>
      <button class="own" id="ownBtn2">今のネット代がわかる人は入れる ›</button>
      <div class="ownbox" id="ownBox2">1か月<input id="ownNet" inputmode="numeric" placeholder="わからなければ空のまま">円</div>
    </section>

    <!-- 4 電気 -->
    <section class="step" data-s="3">
      <div class="lab">住んでいる地域</div><div class="chips" id="area"></div>
      <div class="lab">一緒に住んでる人数（自分も入れて）</div><div class="chips" id="hh"></div>
      <div class="help">選んだ地域と人数の、平均の電気代で計算します。</div>
    </section>

    <!-- 結果 -->
    <section class="step res" data-s="4">
      <div id="cards" style="display:flex;flex-direction:column;gap:9px"></div>
      <button class="again" id="again">最初からやり直す</button>
      <div class="note" id="note"></div>
    </section>
  </div>

  <div class="foot"><div><small id="fl">見直すと1年で</small><div class="num"><span id="total">0</span><em>円</em></div></div><button class="nx" id="next" disabled>次へ</button></div>
</div>

<script>
const $=s=>document.querySelector(s);
const yen=n=>Math.round(n).toLocaleString('ja-JP');
const num=v=>{const n=Number(String(v||'').replace(/[^\d]/g,''));return isFinite(n)?n:0};

/* ===== データ（2026年11月時点・税込の目安） =====
  平均の支払額：MM総研「携帯電話の月額利用料金とサービス利用実態（2026年7月調査）」
    大手4ブランド 4853円 / サブブランド 3296円 / MVNO 1979円（端末代を除く）
  楽天モバイル：3GBまで1078円・20GBまで2178円・無制限3278円
  ahamo：2026年12月から3135円（40GB） */
const BIG=[4853,4853,8000]; // 大手：少なめ・ふつうは平均、使い放題は大手の無制限プランの目安
const CARRIERS=[
  {k:'docomo',n:'ドコモ',c:'#CC0033',cur:BIG,line:'docomo'},
  {k:'au',n:'au',c:'#EB5505',cur:BIG,line:'au'},
  {k:'sb',n:'ソフトバンク',c:'#8A8F94',cur:BIG,line:'sb'},
  {k:'rakuten',n:'楽天モバイル',c:'#BF0000',cur:[1078,2178,3278]},
  {k:'ahamo',n:'ahamo',c:'#1BA1E2',cur:[3135,3135,3135]},
  {k:'povo',n:'povo',c:'#E8C400',cur:[1979,2970,2970]},
  {k:'uq',n:'UQモバイル',c:'#E6007E',cur:[3296,3296,3296]},
  {k:'ym',n:'ワイモバイル',c:'#E60033',cur:[3296,3296,3296]},
  {k:'linemo',n:'LINEMO',c:'#06C755',cur:[1979,2970,2970]},
  {k:'unk',n:'契約したけど、よくわからない',cur:BIG,u:1}
];
const USAGE=[
  {n:'ほぼWi-Fi',e:'外ではLINEと地図くらい（3GBまで）',plan:{k:'rakuten',n:'楽天モバイル（3GBまで）',v:1078}},
  {n:'ふつう',e:'外でSNSや動画をちょっと見る（20GBまで）',plan:{k:'nihontsushin',n:'日本通信SIM（20GB）',v:1390}},
  {n:'動画をよく見る',e:'外でもYouTubeやゲームをする（使い放題）',plan:{k:'rakuten',n:'楽天モバイル（使い放題）',v:3278}}
];
/* 同じ回線のまま安くする場合 */
const SAME={docomo:{k:'ahamo',n:'ahamo（ドコモ回線・40GB）',v:3135}};
/* 家のネット：わからない時の目安と、安い光回線（GMOとくとくBB光） */
const HOME=[
  {n:'戸建て',e:'一軒家に住んでいる',cur:5500,to:4818},
  {n:'マンション・アパート',e:'集合住宅に住んでいる',cur:4400,to:3773},
  {n:'家にネットはない',e:'スマホだけで使っている',cur:0,to:0}
];
/* 電気：地域の平均（2人以上の世帯）と人数の平均（総務省「家計調査」2025年） */
const AREA=[['北海道',13584],['東北',16380],['関東',12716],['北陸',17451],['東海',13154],['近畿',12284],['中国',14787],['四国',14192],['九州',11762],['沖縄',12534]];
const HH=[['1人',6756],['2人',11890],['3人',13593],['4人',13862],['5人以上',15196]];
const HH_AVG=12967, ELEC_CUT=0.05;

/* 申し込み先のURL（links.json で差し替え。アフィリエイトが決まったらそこだけ直す） */
let LINKS={
  rakuten:'https://network.mobile.rakuten.co.jp/',
  nihontsushin:'https://www.nihontsushin.com/',
  ahamo:'https://ahamo.com/',
  hikari:'https://gmobb.jp/',
  denki:'https://enechange.jp/'
};
fetch('links.json?t='+Date.now()).then(r=>r.json()).then(j=>{Object.keys(j).forEach(k=>{if(typeof j[k]==='string'&&j[k])LINKS[k]=j[k]});if(step===4)renderResult()}).catch(()=>{});

const Q=[
  ['スマホ、どこの使ってる？','タップするだけ。\n明細はいらないよ'],
  ['外でどれくらい使う？','ギガがわからなくても大丈夫'],
  ['家のネットは？','わからなければ、よくある料金で計算するよ'],
  ['電気はどこで、何人で使ってる？','平均の電気代で計算するよ'],
  ['1年でこれだけ浮くかも','タップすると、どこに変えればいいか出るよ']
];
const ST={car:-1,use:-1,home:-1,area:-1,hh:-1};
let step=0;

function tile(cls,html,on,fn){const b=document.createElement('button');b.className='t '+cls+(on?' on':'');b.innerHTML=html;b.onclick=fn;return b}
function draw(){
  const c=$('#carriers');c.innerHTML='';
  CARRIERS.forEach((x,i)=>c.appendChild(tile(x.u?'u':'',x.u?x.n:`<i style="background:${x.c}"></i>${x.n}`,ST.car===i,()=>pick('car',i))));
  const u=$('#usage');u.innerHTML='';
  USAGE.forEach((x,i)=>u.appendChild(tile('',`<span>${x.n}</span><em>${x.e}</em>`,ST.use===i,()=>pick('use',i))));
  const h=$('#home');h.innerHTML='';
  HOME.forEach((x,i)=>h.appendChild(tile('',`<span>${x.n}</span><em>${x.e}</em>`,ST.home===i,()=>pick('home',i))));
  const a=$('#area');a.innerHTML='';AREA.forEach((x,i)=>a.appendChild(tile('',x[0],ST.area===i,()=>pick('area',i))));
  const p=$('#hh');p.innerHTML='';HH.forEach((x,i)=>p.appendChild(tile('',x[0],ST.hh===i,()=>pick('hh',i))));
}
function pick(k,i){
  ST[k]=i;draw();calc();
  const auto=(step===0&&k==='car')||(step===1&&k==='use')||(step===2&&k==='home')||(step===3&&ST.area>=0&&ST.hh>=0);
  if(auto)setTimeout(()=>go(step+1),260);
}

/* ===== 計算 ===== */
function parts(){
  const r={phone:null,net:null,elec:null};
  if(ST.car>=0&&ST.use>=0){
    const c=CARRIERS[ST.car],own=num($('#ownPhone').value);
    const cur=own||c.cur[ST.use];
    const plan=USAGE[ST.use].plan;
    const same=c.line&&SAME[c.line];
    r.phone={cur,own:!!own,plan,save:Math.max(0,cur-plan.v)*12,same:same&&same.v<cur?{...same,save:(cur-same.v)*12}:null,c};
  }
  if(ST.home>=0){
    const h=HOME[ST.home],own=num($('#ownNet').value);
    const cur=h.cur?(own||h.cur):0;
    r.net={cur,own:!!own,to:h.to,save:h.cur?Math.max(0,cur-h.to)*12:0,none:!h.cur};
  }
  if(ST.area>=0&&ST.hh>=0){
    const cur=Math.round(AREA[ST.area][1]*HH[ST.hh][1]/HH_AVG/10)*10;
    r.elec={cur,save:Math.round(cur*ELEC_CUT)*12};
  }
  return r;
}
let shown=0,raf=0;
function animate(to){cancelAnimationFrame(raf);const from=shown,t0=performance.now(),d=500;
  const f=t=>{const k=Math.min(1,(t-t0)/d);shown=from+(to-from)*(1-Math.pow(1-k,3));$('#total').textContent=yen(shown);if(k<1)raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
function calc(){const r=parts();let t=0;['phone','net','elec'].forEach(k=>{if(r[k])t+=r[k].save});animate(t);btn();return r}

/* ===== 結果 ===== */
function card(ic,title,sub,save,inner){
  const d=document.createElement('div');d.className='card';
  d.innerHTML=`<button><span class="ic">${ic}</span><span class="nm">${sub}<b>${title}</b></span><span class="sv">${save>0?'1年で<b>'+yen(save)+'円</b>':'<b class="zero">もう安い</b>'}</span></button><div class="in">${inner}</div>`;
  d.querySelector('button').onclick=()=>{const o=d.classList.contains('open');document.querySelectorAll('.card').forEach(x=>x.classList.remove('open'));if(!o)d.classList.add('open')};
  return d;
}
function link(k,label,sub){return `<a class="go${sub?' sub':''}" href="${LINKS[k]||'#'}" target="_blank" rel="noopener sponsored">${label}</a>`}
function renderResult(){
  const r=parts(),box=$('#cards');box.innerHTML='';
  if(r.phone){const p=r.phone;
    let h=`<p>今：${p.c.u?'大手の平均':p.c.n} 月${yen(p.cur)}円${p.own?'（入れた金額）':'くらい'}\nおすすめ：${p.plan.n} 月${yen(p.plan.v)}円</p>`;
    if(p.save>0)h+=link(p.plan.k,p.plan.n.replace(/（.*/,'')+'を見る');
    else h+='<p>今のままで十分安いです。</p>';
    if(p.same)h+=`<p style="margin-top:10px">番号も回線もそのままがいいなら\n${p.same.n} 月${yen(p.same.v)}円（1年で${yen(p.same.save)}円）</p>`+link(p.same.k,'ahamoを見る',1);
    if(p.c.u)h+=`<p style="margin-top:10px;font-size:12px;color:#6b6f6b">正確に知りたいときは、スマホ会社のアプリ（My docomo・My au・My SoftBankなど）の「料金」か「請求」を開くと、毎月の金額が出ます。</p>`;
    box.appendChild(card('📱','スマホ代','見直すと',p.save,h));}
  if(r.net){const n=r.net;
    let h=n.none?'<p>家のネットがないので、ここは0円です。</p>':`<p>今：月${yen(n.cur)}円${n.own?'（入れた金額）':'くらい'}\nおすすめ：GMOとくとくBB光 月${yen(n.to)}円</p>`+(n.save>0?link('hikari','安い光回線を見る'):'<p>今のままで十分安いです。</p>');
    box.appendChild(card('🏠','家のネット代','見直すと',n.save,h));}
  if(r.elec){const e=r.elec;
    box.appendChild(card('💡','電気代','見直すと',e.save,`<p>今：月${yen(e.cur)}円くらい（${AREA[ST.area][0]}・${HH[ST.hh][0]}の平均）\n電気の会社を変えて5%安くなった場合で計算しています。\n工事や立ち会いはいりません。</p>`+link('denki','電気の会社をくらべる')));}
  $('#note').textContent='金額は目安です（2026年11月時点・税込）。\nスマホの平均はMM総研の2026年7月調査、電気は総務省「家計調査」2025年をもとにしています。\nお申し込みの前に、各社の公式サイトで料金をご確認ください。';
}

/* ===== 画面の移動 ===== */
function btn(){
  const ok=[ST.car>=0,ST.use>=0,ST.home>=0,ST.area>=0&&ST.hh>=0][step];
  const n=$('#next');
  if(step===4){n.disabled=false;n.textContent='シェア';}else{n.disabled=!ok;n.textContent=step===3?'結果を見る':'次へ';}
  $('#fl').textContent=step===4?'見直すと1年で':'ここまでで1年で';
}
function go(s){
  if(s<0||s>4)return;step=s;
  document.querySelectorAll('.step').forEach(el=>{const i=+el.dataset.s;el.classList.toggle('now',i===s);el.classList.toggle('gone',i<s)});
  $('#q').textContent=Q[s][0];$('#qs').textContent=Q[s][1];
  document.querySelectorAll('#bar i').forEach((x,i)=>x.classList.toggle('on',i<=Math.min(s,3)));
  $('#back').style.visibility=s>0?'visible':'hidden';
  if(s===4){renderResult();const f=document.querySelector('.card');if(f)f.classList.add('open')}
  calc();
}
$('#next').onclick=()=>{
  if(step<4)return go(step+1);
  const t='固定費を見直すと、1年で'+$('#total').textContent+'円浮くかもしれないらしい';
  if(navigator.share)navigator.share({text:t,url:location.href}).catch(()=>{});
  else location.href='https://www.threads.net/intent/post?text='+encodeURIComponent(t+' '+location.href);
};
$('#back').onclick=()=>go(step-1);
$('#again').onclick=()=>{Object.keys(ST).forEach(k=>ST[k]=-1);$('#ownPhone').value='';$('#ownNet').value='';draw();go(0)};
$('#ownBtn').onclick=()=>{$('#ownBox').classList.toggle('show');$('#ownPhone').focus()};
$('#ownBtn2').onclick=()=>{$('#ownBox2').classList.toggle('show');$('#ownNet').focus()};
['#ownPhone','#ownNet'].forEach(s=>$(s).addEventListener('input',calc));
draw();go(0);
</script>
</body>
</html>
