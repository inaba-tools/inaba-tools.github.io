<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>inabaTube</title>
<meta name="description" content="inabaTubeは、YouTubeの登録チャンネルの新着動画を、iPadの横画面で見やすく並べるシンプルな動画ビューアです。ショートなし、小窓再生、コメント表示に対応。">
<link rel="canonical" href="https://inaba-tools.github.io/inabatube/">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="inabaTube">
<meta property="og:description" content="登録チャンネルの新着動画を、iPadの横画面で見やすく。ショートなし・小窓再生つきのシンプルな動画ビューア。">
<meta property="og:url" content="https://inaba-tools.github.io/inabatube/">
<meta property="og:image" content="https://inaba-tools.github.io/inabatube/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-title" content="inabaTube">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"inabaTube","url":"https://inaba-tools.github.io/inabatube/","applicationCategory":"MultimediaApplication","operatingSystem":"iPadOS, iOS, Web","description":"YouTubeの登録チャンネルの新着動画を、iPadの横画面で見やすく並べるシンプルな動画ビューア。","offers":{"@type":"Offer","price":"0","priceCurrency":"JPY"}}
</script>
<style>
:root{--bg:#0b0b0c;--panel:#141416;--card:#1b1b1e;--line:#ffffff14;--text:#f3efe9;--sub:#a59e94;--accent:#ff8a3d;--accent2:#2b2118;--r:6px;--font:-apple-system,"Hiragino Sans",sans-serif;--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%;background:var(--bg);color:var(--text);font-family:var(--font)}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block}
.hidden{display:none!important}

/* ===== header ===== */
body{display:flex;flex-direction:column;height:100dvh}
header{position:relative;flex:none;z-index:10;display:flex;align-items:center;gap:16px;padding:calc(var(--st) + 14px) 24px 10px;background:linear-gradient(var(--bg) 80%,#0b0b0c00)}
.logo{font-weight:800;font-size:22px;letter-spacing:.01em;white-space:nowrap}
.logo span{color:var(--accent)}
#sf{position:absolute;left:50%;transform:translateX(-50%);width:min(560px,46vw);display:flex;gap:8px}
#q{flex:1;font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 18px;color:var(--text);outline:none}
#q:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;padding:2px 24px 14px;overflow:auto;scrollbar-width:none}
.chip{white-space:nowrap;background:var(--panel);padding:8px 16px;border-radius:999px;font-size:14px}
.chip.on{background:var(--accent);color:#000;font-weight:700}

/* ===== grid ===== */
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:70px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 18px;padding:0 24px}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.v{text-align:left;width:100%;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;align-self:start}
.th{position:relative;height:0;padding-top:56.25%;border-radius:var(--r);overflow:hidden;background:var(--card)}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th i{position:absolute;right:7px;bottom:7px;background:#000d;color:#fff;font-style:normal;font-size:12px;font-weight:600;padding:2px 6px;border-radius:4px}
.th .seen{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent)}
.meta{display:flex;gap:10px;margin-top:10px}
.av{cursor:pointer;width:36px;height:36px;border-radius:50%;flex:none;background:var(--accent2);object-fit:cover}
.t{font-size:15px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.4}
.msg{padding:60px 24px;text-align:center;color:var(--sub);line-height:1.9;white-space:pre-line}
.btn{display:inline-block;background:var(--accent);color:#000;font-weight:700;padding:12px 24px;border-radius:999px;font-size:16px;margin-top:16px}
.btn.ghost{background:var(--panel);color:var(--text)}
.sec{padding:4px 24px 12px;font-size:18px;font-weight:700}

/* channels list */
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:0 24px}
.ch{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:var(--r);padding:12px;text-align:left}
.ch img{width:44px;height:44px;border-radius:50%}
.ch b{font-size:14px;font-weight:600;line-height:1.35}

/* ===== tabs ===== */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:72px;padding:7px 0 calc(env(safe-area-inset-bottom,0px) + 7px);background:var(--panel);border-top:1px solid var(--line)}
.tabs button{font-size:0;color:var(--sub);text-align:center;min-width:56px;height:34px}
.tabs button.on{color:var(--accent);font-weight:700}
.tabs b{display:block;font-size:22px;line-height:1}
.prog{padding:0 24px 10px;color:var(--sub);font-size:13px;min-height:1px}

/* ===== watch ===== */
#watch{position:fixed;inset:0;overflow:hidden;z-index:30;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) 340px;transform:translateY(0);transition:transform .28s ease}
#watch.away{transform:translateY(100%);pointer-events:none}
@media (max-width:900px){#watch{grid-template-columns:1fr}#side{display:none}}
#left{display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:0 16px}
#topbar{position:fixed;z-index:42;left:0;top:0;width:calc(100% - 340px);height:calc(var(--st) + 34px);display:flex;align-items:flex-end;gap:6px;padding:0 10px 4px;touch-action:none}
@media (max-width:900px){#topbar{width:100%}}
#topbar::after{content:'';position:absolute;left:50%;bottom:14px;width:56px;height:5px;margin-left:-28px;border-radius:9px;background:#ffffff40}
#topbar button{width:40px;height:30px;font-size:20px;border-radius:8px;color:var(--sub)}
#watch.away #topbar{display:none}
#slot{flex:none;width:min(100%,calc((100dvh - var(--st) - 130px) * 16 / 9));align-self:center;aspect-ratio:16/9;margin-top:calc(var(--st) + 36px)}
#info{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px 0 40px}
#vt{font-size:19px;font-weight:700;line-height:1.45;margin:0}
#vs{font-size:13px;color:var(--sub);margin-top:6px}
.chrow{display:flex;align-items:center;gap:12px;margin:14px 0}
.chrow img{width:42px;height:42px;border-radius:50%}
.chrow b{font-size:15px}
.desc{display:none;background:var(--panel);border-radius:var(--r);font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word;margin-top:12px}
.desc>.in{padding:12px 14px}
.desc.open{display:block;animation:descIn .32s var(--ease)}
@keyframes descIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#vhead{cursor:pointer}
#vs .more{margin-left:10px;color:var(--text);font-weight:600}
#vs .more i{font-style:normal;display:inline-block;transition:transform .35s var(--ease)}
#vhead.open #vs .more i{transform:rotate(180deg)}
.desc a{color:var(--accent)}
.cmh{font-size:16px;font-weight:700;margin:22px 0 10px}
/* コメント：チャンネルの下にカード、押すと右側（関連動画の場所）をコメントで埋める */
.cmcard{display:block;width:100%;background:var(--panel);border-radius:var(--r);padding:12px 14px;margin:2px 0 14px;text-align:left}
.cmcard .hd{display:flex;justify-content:space-between;font-size:15px;font-weight:700}
.cmcard .hd i{font-style:normal;color:var(--sub)}
.cmcard .tp{display:flex;gap:10px;align-items:flex-start;margin-top:8px;font-size:13px;line-height:1.5}
.cmcard .tp:empty{display:none}
.cmcard .tp img{width:24px;height:24px;border-radius:50%;flex:none}
.cmcard .tp span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#cmpanel{position:absolute;top:0;right:0;bottom:0;width:340px;z-index:6;background:var(--bg);display:flex;flex-direction:column;padding:calc(var(--st) + 12px) 16px 0 0;transform:translateX(105%);transition:transform .42s var(--ease)}
#cmpanel.open{transform:none}
@media (max-width:900px){#cmpanel{width:100%;padding-left:16px}}
.cmph{display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px;border-bottom:1px solid var(--line)}
.cmph b{font-size:16px}
.cmph small{display:block;font-size:12px;color:var(--sub);font-weight:400;margin-top:2px}
.cmph button{width:40px;height:40px;font-size:20px;border-radius:8px;background:var(--panel)}
.cmbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding-bottom:40px}
.cmbody .s{white-space:pre-line;padding:6px 0 10px}
.cm{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.cm img{width:32px;height:32px;border-radius:50%;flex:none}
.cm .n{font-size:12px;color:var(--sub)}
.cm .rp{font-size:13px;color:var(--accent);margin-top:6px;font-weight:600;padding:4px 0}
.cm .rps .cm{border-top:0;padding:8px 0}
.cm .rps .cm img{width:24px;height:24px}
.cm .x{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-top:2px}
#side{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;padding:calc(var(--st) + 12px) 16px 40px 0}
.rv{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;text-align:left;width:100%}
.rv .th{width:150px;height:84px;padding-top:0;flex:none}
.rv .t{font-size:13px}
.rv .s{font-size:12px}

/* ===== player pane (moves between watch slot and mini) ===== */
#pane{position:fixed;z-index:40;background:#000;overflow:hidden;border-radius:var(--r);left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform;backface-visibility:hidden}
#pane.max{z-index:65;border-radius:0}
#pane.mini{box-shadow:0 14px 44px #000c;outline:2px solid var(--accent)}
#pl,#pane iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#hit{position:absolute;inset:0;z-index:2;display:none}
/* ===== 自前の操作パネル（YouTubeアプリと同じ操作） ===== */
#pcov{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;background:linear-gradient(#000 0,#000 13%,#0000 27%,#0000 58%,#000 74%,#000 100%);transition:opacity .2s}
#pcov.on{opacity:1}

#ui{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .22s}
#ui.show{opacity:1}
#ui.show .ctl{pointer-events:auto}
#ui .shade{position:absolute;inset:0;background:#0007}
#cpp{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;background:#0008;color:#fff;font-size:26px;display:grid;place-items:center}
.vbar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:0 14px 10px;color:#fff;font-size:13px;font-variant-numeric:tabular-nums}
.vbar button{color:#fff;font-size:15px;font-weight:700;min-width:40px;height:36px;border-radius:8px}
#seek{position:relative;flex:1;height:30px;touch-action:none;cursor:pointer}
#seek .tr,#seek .bf,#seek .ps{position:absolute;left:0;top:13px;height:4px;border-radius:2px}
#seek .tr{right:0;background:#ffffff40}
#seek .bf{background:#ffffff70;width:0}
#seek .ps{background:var(--accent);width:0}
#seek .kn{position:absolute;top:8px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--accent);left:0;transition:transform .15s}
#seek.drag .kn{transform:scale(1.4)}
#seek .tip{position:absolute;bottom:30px;transform:translateX(-50%);background:#000c;padding:3px 8px;border-radius:6px;font-size:13px;display:none}
#seek.drag .tip{display:block}
#sprev{position:absolute;bottom:58px;width:208px;height:117px;border-radius:8px;overflow:hidden;background:#000;display:none;outline:2px solid #ffffff55;box-shadow:0 8px 24px #000c;pointer-events:none}
#seek.drag #sprev{display:block}
#sprev iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
#spdm{position:absolute;right:14px;bottom:52px;z-index:4;background:#1b1b1eee;border-radius:10px;padding:6px;display:none;flex-direction:column;min-width:110px}
#spdm.show{display:flex}
#spdm button{color:#fff;padding:9px 12px;text-align:left;border-radius:6px;font-size:14px}
#spdm button.on{color:var(--accent);font-weight:700}
.skip{position:absolute;top:0;bottom:0;width:38%;z-index:3;display:grid;place-items:center;pointer-events:none;opacity:0;color:#fff;font-size:17px;font-weight:700;transition:opacity .3s}
.skip.l{left:0;border-radius:0 50% 50% 0/0 50% 50% 0;background:#ffffff1c}
.skip.r{right:0;border-radius:50% 0 0 50%/50% 0 0 50%;background:#ffffff1c}
.skip.on{opacity:1;transition:none}
#rate{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:3;background:#000b;color:#fff;font-size:14px;font-weight:700;padding:6px 14px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .2s}
#rate.show{opacity:1}
#ui,#spdm,#pcov{display:none!important}
#vtouch{display:none}
#pane.max #vtouch{display:block;inset:0 0 auto 0;height:12%}
#vtouch::after{content:'';position:absolute;left:50%;top:8px;width:48px;height:5px;margin-left:-24px;border-radius:9px;background:#ffffff55}
#vtouch{position:absolute;inset:0;z-index:2;touch-action:none}
#pane.mini #vtouch{display:none}
#pane.mini #hit{display:block;background:linear-gradient(#0000 55%,#000a)}
#hit .mb{position:absolute;bottom:8px;width:40px;height:40px;border-radius:50%;background:#000a;font-size:18px;color:#fff;display:grid;place-items:center}
#mpp{left:10px}
#mx{right:10px}
#hint{position:absolute;left:58px;right:58px;bottom:16px;font-size:11px;color:#ddd;text-align:center;pointer-events:none}
#pane.gone{opacity:0;pointer-events:none}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:60;background:#000e;border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-size:14px}

/* ===== アニメーション ===== */
:root{--spring:cubic-bezier(.22,1.2,.36,1);--ease:cubic-bezier(.2,.8,.2,1)}
/* C: 押すと少し沈む */
button{transition:transform .18s var(--ease),background-color .2s,color .2s,opacity .2s}
button:active{transform:scale(.95)}
.v:active,.rv:active,.ch:active{transform:scale(.97)}
.v .th img,.rv .th img{transition:transform .35s var(--ease),filter .35s}
.v:active .th img{transform:scale(1.04);filter:brightness(1.12)}
.chip{transition:transform .18s var(--ease),background-color .25s,color .25s}
.chip.on{animation:pop .35s var(--spring)}
@keyframes pop{0%{transform:scale(.88)}100%{transform:scale(1)}}
.tabs button b{transition:transform .3s var(--spring)}
.tabs button.on b{animation:bounce .45s var(--spring)}
@keyframes bounce{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-6px) scale(1.18)}100%{transform:translateY(0) scale(1)}}
/* A: カードが順番にふわっと出る */
.grid>.v,.chs>.ch,.side-in>.rv,.cm{opacity:0;animation:rise .5s var(--ease) forwards;animation-delay:calc(min(var(--i,0),18) * 35ms)}
.grid.noanim>.v{animation:none;opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
/* A: タブ切り替えでスッと流れる */
#view.slide-l{animation:slideL .38s var(--ease)}
#view.slide-r{animation:slideR .38s var(--ease)}
#view.fade{animation:fadeUp .35s var(--ease)}
@keyframes slideL{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg{animation:fadeUp .4s var(--ease)}
/* C: 読み込み中はオレンジの光が流れる */
.sk .th,.sk .l{position:relative;overflow:hidden;background:var(--card)}
.sk .l{height:13px;border-radius:4px;margin-top:10px}
.sk .l.w2{width:60%}
.sk .th::after,.sk .l::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,#0000,#ff8a3d22 45%,#ff8a3d44 50%,#ff8a3d22 55%,#0000);animation:sheen 1.3s ease-in-out infinite}
@keyframes sheen{to{transform:translateX(100%)}}
.loadbar{position:fixed;left:0;top:0;height:3px;width:100%;z-index:70;background:linear-gradient(90deg,#0000,var(--accent),#0000);background-size:50% 100%;background-repeat:no-repeat;animation:bar 1s linear infinite;pointer-events:none}
@keyframes bar{from{background-position:-50% 0}to{background-position:150% 0}}
/* 再生画面の出入りをバネっぽく */
#watch{transition:transform .42s var(--ease),opacity .3s}
#pane{transition:box-shadow .3s,opacity .25s}
#pane.flip{transition:transform .42s var(--ease),box-shadow .3s,opacity .25s}
#watch{will-change:transform;backface-visibility:hidden}
#pane.dragging,#watch.dragging{transition:none!important}
#info>*{animation:fadeUp .4s var(--ease) both}
.toast{animation:toastIn .35s var(--spring)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.grid>.v,.chs>.ch,.side-in>.rv,.cm{opacity:1}}
</style>
</head>
<body>
<header>
  <button class="logo" id="logo">inaba<span>Tube</span></button>
  <form id="sf"><input id="q" type="search" placeholder="検索" enterkeyhint="search" autocomplete="off"></form>
</header>

<main id="main">
  <div class="chips" id="chips"></div>
  <div id="view"></div>
</main>

<nav class="tabs" id="tabs">
  <button data-tab="home" class="on" aria-label="ホーム（盛り上がり）"><b>⌂</b></button>
  <button data-tab="new" aria-label="新着"><b>◷</b></button>
  <button data-tab="trend" aria-label="急上昇"><b>↗</b></button>
  <button data-tab="me" aria-label="マイページ"><b>◎</b></button>
</nav>

<section id="watch" class="away" aria-hidden="true">
  <div id="topbar">
    <button id="down" aria-label="小さくする">⌄</button>
    <button id="fs" aria-label="全画面">⤢</button>
  </div>
  <div id="left">
    <div id="slot"></div>
    <div id="info"></div>
  </div>
  <aside id="side"></aside>
  <div id="cmpanel"><div class="cmph"><div><b id="cmpt">コメント</b><small>いいねが多い順</small></div><button id="cmx" aria-label="閉じる">✕</button></div><div class="cmbody" id="cms"></div></div>
</section>

<div id="pane" class="gone">
  <div id="pl"></div>
  <div id="pcov"></div>
  <div id="vtouch"></div>
  <div id="ui"><div class="shade"></div>
    <button class="ctl" id="cpp" aria-label="再生・一時停止">❚❚</button>
    <div class="vbar"><span id="tcur">0:00</span>
      <div class="ctl" id="seek"><div class="tr"></div><div class="bf"></div><div class="ps"></div><div class="kn"></div><div class="tip"></div><div id="sprev"><div id="pv"></div></div></div>
      <span id="tdur">0:00</span><button class="ctl" id="spd">1x</button><button class="ctl" id="fsb" aria-label="全画面">⤢</button></div>
  </div>
  <div id="spdm"></div>
  <div class="skip l" id="skl">« 10秒</div><div class="skip r" id="skr">10秒 »</div>
  <div id="rate">2倍速 ▶▶</div>
  <div id="hit">
    <button class="mb" id="mpp" aria-label="再生・一時停止">❚❚</button>
    <div id="hint">上スワイプで戻す・下スワイプで閉じる</div>
    <button class="mb" id="mx" aria-label="閉じる">✕</button>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async></script>
<script src="https://www.youtube.com/iframe_api" async></script>
<script>
/* ============ 設定 ============ */
const CLIENT_ID = '610146352020-hd7mv58n38ueeslehag244ega0rrn4o4.apps.googleusercontent.com'; // Google Cloud の OAuth クライアントID（設定後に入る）
const API_KEY = 'AIzaSyBhhAe1sM3LhLUmr4MNMXF_iA0Ey4ax_zo'; // ログインなしで新着を取るためのAPIキー（inaba-tools.github.io からだけ使える制限つき）
const SCOPE = 'https://www.googleapis.com/auth/youtube.readonly';
const API = 'https://www.googleapis.com/youtube/v3/';

/* ============ 小物 ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k, d = null) { try { const v = localStorage.getItem('it_' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('it_' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('it_' + k); } catch {} }
};
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2400); }
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600) return Math.max(1, Math.floor(s / 60)) + ' 分前';
  if (s < 86400) return Math.floor(s / 3600) + ' 時間前';
  if (s < 86400 * 30) return Math.floor(s / 86400) + ' 日前';
  if (s < 86400 * 365) return Math.floor(s / 86400 / 30) + ' か月前';
  return Math.floor(s / 86400 / 365) + ' 年前';
}
function num(n) {
  n = +n || 0;
  if (n >= 1e8) return (n / 1e8).toFixed(n < 1e9 ? 1 : 0).replace(/\.0$/, '') + '億';
  if (n >= 1e4) return (n / 1e4).toFixed(n < 1e5 ? 1 : 0).replace(/\.0$/, '') + '万';
  return n.toLocaleString();
}
function secs(iso) { const m = /P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(iso || '') || []; return (+m[1]||0)*86400 + (+m[2]||0)*3600 + (+m[3]||0)*60 + (+m[4]||0); }
function dur(iso) { let s = secs(iso); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); s = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); }
const isVertical = v => { const w = +v.player?.embedWidth, h = +v.player?.embedHeight; return w > 0 && h > w; };
const isShort = v => { const d = secs(v.contentDetails?.duration); return (d > 0 && d <= 60) || (d > 0 && d <= 180 && isVertical(v)) || /#shorts/i.test(v.snippet?.title + ' ' + v.snippet?.description); };
// 盛り上がり度：1時間あたりの再生数（新しいほど少し有利）
const heat = v => (+v.views || 0) / Math.pow((Date.now() - new Date(v.at)) / 3600e3 + 2, 1.25);
const isLive = v => v.snippet?.liveBroadcastContent === 'live' || v.snippet?.liveBroadcastContent === 'upcoming';

/* ============ ログイン ============ */
let token = ls.get('token');
let tokenClient = null;
const loggedIn = () => token && token.exp > Date.now() + 60000;
function initAuth() {
  if (!CLIENT_ID || !window.google?.accounts?.oauth2) return false;
  if (!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPE,
    callback: r => {
      if (r.error) { toast('ログインできませんでした'); return; }
      token = { v: r.access_token, exp: Date.now() + (r.expires_in - 60) * 1000 };
      ls.set('token', token); ls.set('everLogged', true);
      ls.del('homeCache'); getSubs(true).catch(() => {}).finally(() => { state.tab = 'home'; route(); });
    }
  });
  return true;
}
/* ページごとGoogleへ移動してログインし、自動で戻ってくる（ボタンを押さなくても開いた時点で動く） */
const REDIRECT = 'https://inaba-tools.github.io/inabatube/'; // Google Cloud に登録した戻り先と完全に同じにする
function loginRedirect(silent) {
  if (!CLIENT_ID) return;
  const st = Math.random().toString(36).slice(2);
  try { sessionStorage.setItem('it_state', st); sessionStorage.setItem('it_try', silent ? 'silent' : 'full'); } catch {}
  const u = new URL('https://accounts.google.com/o/oauth2/v2/auth');
  Object.entries({ client_id: CLIENT_ID, redirect_uri: REDIRECT, response_type: 'token', scope: SCOPE,
    include_granted_scopes: 'true', state: st, prompt: silent ? 'none' : 'select_account' }).forEach(([k, v]) => u.searchParams.set(k, v));
  location.replace(u);
}
function takeRedirectResult() {
  if (!location.hash.includes('state=')) return null;
  const h = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', REDIRECT);
  let st = null, tried = null;
  try { st = sessionStorage.getItem('it_state'); tried = sessionStorage.getItem('it_try'); sessionStorage.removeItem('it_state'); } catch {}
  if (h.get('state') !== st) return null;
  if (h.get('access_token')) {
    token = { v: h.get('access_token'), exp: Date.now() + ((+h.get('expires_in') || 3600) - 60) * 1000 };
    ls.set('token', token); ls.set('everLogged', true); ls.del('homeCache');
    try { sessionStorage.removeItem('it_try'); } catch {}
    return 'ok';
  }
  // Googleのログインが残っていなかったときは、アカウント選択画面へ（1回だけ）
  if (tried === 'silent') return 'needFull';
  try { sessionStorage.removeItem('it_try'); } catch {}
  return 'fail';
}
function autoLogin() {
  const r = takeRedirectResult();
  if (r === 'ok') return true;
  if (r === 'needFull') { loginRedirect(false); return false; }
  if (r === 'fail') return true; // 失敗したらループさせずにボタン表示に戻す
  if (!hasSubs() && !loggedIn() && CLIENT_ID) { loginRedirect(true); return false; }
  return true;
}
function login() {
  if (!CLIENT_ID) { toast('Googleの設定がまだです'); return; }
  return loginRedirect(false);
  if (!initAuth()) { toast('読み込み中です。\nもう一度押してください'); return; }
  tokenClient.requestAccessToken({ prompt: ls.get('everLogged') ? '' : 'consent' });
}
function logout() {
  if (token && window.google?.accounts?.oauth2) google.accounts.oauth2.revoke(token.v, () => {});
  token = null; ls.del('token'); ls.del('everLogged'); ls.del('homeCache'); ls.del('subs');
  route();
}

/* ============ API ============ */
const hasSubs = () => !!ls.get('subs')?.list?.length;
const canUse = () => loggedIn() || (API_KEY && hasSubs());
async function yt(path, params) {
  setBusy(true);
  try { return await ytRaw(path, params); } finally { setBusy(false); }
}
async function ytRaw(path, params) {
  const forceKey = params._key && API_KEY; delete params._key;
  const useToken = loggedIn() && !forceKey;
  if (!useToken && (params.mine || !API_KEY)) throw new Error('login');
  const u = new URL(API + path);
  Object.entries(params).forEach(([k, v]) => v !== undefined && v !== '' && u.searchParams.set(k, v));
  if (!useToken) u.searchParams.set('key', API_KEY);
  const r = await fetch(u, useToken ? { headers: { Authorization: 'Bearer ' + token.v } } : { referrerPolicy: 'no-referrer-when-downgrade' });
  if (r.status === 401 && useToken) { token = null; ls.del('token'); return ytRaw(path, params); }
  const j = await r.json();
  if (!r.ok) { const e = new Error(j.error?.errors?.[0]?.reason || 'api'); e.code = r.status; throw e; }
  return j;
}
async function videosByIds(ids) {
  const chunks = [];
  for (let i = 0; i < ids.length; i += 50) chunks.push(ids.slice(i, i + 50));
  const res = await Promise.all(chunks.map(c => yt('videos', { part: 'snippet,contentDetails,statistics,player', maxHeight: 360, id: c.join(','), maxResults: 50 })));
  return res.flatMap(j => j.items);
}
async function pool(items, n, fn) {
  const res = []; let i = 0;
  await Promise.all(Array.from({ length: n }, async () => { while (i < items.length) { const k = i++; try { res[k] = await fn(items[k]); } catch { res[k] = null; } } }));
  return res;
}
async function getSubs(force) {
  const c = ls.get('subs');
  // 一度取り込んだ一覧はずっと使う（ログイン中だけ6時間ごとに自動で取り直す）
  if (c && (!loggedIn() || (!force && c.t > Date.now() - 6 * 3600e3))) return c.list;
  const list = []; let page = '';
  for (let n = 0; n < 6; n++) {
    const j = await yt('subscriptions', { part: 'snippet', mine: true, maxResults: 50, order: 'alphabetical', pageToken: page });
    j.items.forEach(s => list.push({ id: s.snippet.resourceId.channelId, title: s.snippet.title, icon: s.snippet.thumbnails?.default?.url }));
    page = j.nextPageToken; if (!page) break;
  }
  ls.set('subs', { t: Date.now(), list });
  return list;
}
const uploads = id => 'UU' + id.slice(2);
async function channelVideos(chId, n) {
  const j = await yt('playlistItems', { part: 'contentDetails', playlistId: uploads(chId), maxResults: n });
  return j.items.map(x => x.contentDetails.videoId);
}
async function homeFeed(force, onPart) {
  const c = ls.get('homeCache');
  if (!force && c && c.t > Date.now() - 10 * 60e3) return c.v;
  const subs = await getSubs(force);
  // 取れた分から順に表示する（全部そろうのを待たない）
  const all = new Map(); let queue = [], last = 0;
  const sorted = () => [...all.values()].sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, 240);
  const flush = async (final) => {
    const ids = [...new Set(queue.splice(0))].filter(id => !all.has(id));
    if (ids.length) (await videosByIds(ids)).filter(v => !isShort(v)).forEach(v => all.set(v.id, slimV(v)));
  };
  const list = subs.slice(0, 150); let done = 0;
  await pool(list, 24, async s => {
    queue.push(...(await channelVideos(s.id, 4)));
    onPart?.(++done, list.length);
    if (queue.length >= 50) await flush();
  });
  await flush(true);
  const slim = sorted();
  ls.set('homeCache', { t: Date.now(), v: slim });
  return slim;
}
function slimV(v) {
  return { id: v.id, title: v.snippet.title, ch: v.snippet.channelTitle, chId: v.snippet.channelId, at: v.snippet.publishedAt,
    views: v.statistics?.viewCount, comments: v.statistics?.commentCount, likes: v.statistics?.likeCount, dur: v.contentDetails?.duration, live: isLive(v),
    thumb: v.snippet.thumbnails?.medium?.url || `https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`, desc: v.snippet.description };
}
const iconOf = chId => (ls.get('subs')?.list || []).find(s => s.id === chId)?.icon || ls.get('icons', {})[chId] || '';
async function fillIcons(vs) {
  const need = [...new Set(vs.map(v => v.chId))].filter(id => !iconOf(id));
  if (!need.length) return;
  const map = ls.get('icons', {});
  for (let i = 0; i < need.length; i += 50) {
    const j = await yt('channels', { part: 'snippet', id: need.slice(i, i + 50).join(','), maxResults: 50 });
    j.items.forEach(c => map[c.id] = c.snippet.thumbnails?.default?.url);
  }
  ls.set('icons', map);
}

/* ============ 履歴 ============ */
const seen = () => ls.get('seen', []);
function markSeen(v) { const h = seen().filter(x => x.id !== v.id); h.unshift(v); ls.set('seen', h.slice(0, 200)); }

/* ============ 描画 ============ */
const cache = {};
const HQ = id => `https://i.ytimg.com/vi/${id}/hq720.jpg`;
const thumbImg = (id, cls = '') => `<img loading="lazy" decoding="async" src="${HQ(id)}" alt="" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${id}/hqdefault.jpg'">`;
function card(v, i = 0) {
  cache[v.id] = v;
  const s = seen().some(x => x.id === v.id);
  return `<button class="v" style="--i:${i}" data-v="${esc(v.id)}">
    <div class="th">${thumbImg(esc(v.id))}<i>${v.live ? 'ライブ' : esc(dur(v.dur))}</i>${s ? '<div class="seen"></div>' : ''}</div>
    <div class="meta"><img class="av" data-ch="${esc(v.chId)}" data-name="${esc(v.ch)}" loading="lazy" src="${esc(iconOf(v.chId))}" alt="" onerror="this.style.visibility='hidden'">
    <div><div class="t">${esc(v.title)}</div><div class="s">${esc(v.ch)} ・ ${num(v.views)}回視聴 ・ ${ago(v.at)}</div></div></div></button>`;
}
const grid = vs => vs.length ? `<div class="grid">${vs.map((v, i) => card(v, i)).join('')}</div>` : `<div class="msg">表示できる動画がありません。</div>`;
function loading() {
  const one = '<div class="v sk" style="opacity:1;animation:none"><div class="th"></div><div class="l"></div><div class="l w2"></div></div>';
  $('#view').innerHTML = `<div class="prog" id="prog"></div><div class="grid">${one.repeat(9)}</div>`;
}
let busy = 0;
function setBusy(on) {
  busy = Math.max(0, busy + (on ? 1 : -1));
  let b = $('.loadbar');
  if (busy && !b) { b = document.createElement('div'); b.className = 'loadbar'; document.body.append(b); }
  if (!busy && b) b.remove();
}
function needLogin() {
  $('#chips').innerHTML = '';
  $('#view').innerHTML = CLIENT_ID
    ? `<div class="msg">登録チャンネルの新着を表示するには、Googleでログインしてください。\n最初に1回ログインすれば、登録チャンネルの一覧を取り込みます。
そのあとはログインが切れても、ずっと見られます。\n<button class="btn" id="lg">Googleでログイン</button></div>`
    : `<div class="msg">準備中です。\nGoogle側の設定が終わると使えるようになります。</div>`;
  $('#lg')?.addEventListener('click', login);
}
function showErr(e) {
  if (e.message === 'login') return needLogin();
  const m = e.message === 'quotaExceeded' ? '今日の無料の利用上限に達しました。\n明日（夕方5時ごろ）にリセットされます。' : '読み込みに失敗しました。\n(' + esc(e.message) + ')';
  $('#view').innerHTML = `<div class="msg">${m}\n<button class="btn ghost" id="rt">もう一度</button></div>`;
  $('#rt').onclick = route;
}

/* ============ 画面 ============ */
const state = { tab: 'home', chip: 'all', search: '', channel: null };
function chips(title) {
  $('#chips').innerHTML = title ? `<div class="sec" style="padding:0">${title}</div>` : '';
}
const TAB_ORDER = { home: 0, new: 1, trend: 2, me: 3 };
let lastTab = 'home';
function animView() {
  const v = $('#view'), d = TAB_ORDER[state.tab] - TAB_ORDER[lastTab];
  v.classList.remove('slide-l', 'slide-r', 'fade'); void v.offsetWidth;
  v.classList.add(d > 0 ? 'slide-l' : d < 0 ? 'slide-r' : 'fade');
  lastTab = state.tab;
}
async function route() {
  animView();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  $('#main').scrollTop = 0;
  if (state.tab === 'me') return renderMe();
  if (!canUse()) return needLogin();
  try {
    if (state.search) return await renderSearch();
    if (state.channel) return await renderChannel();
    if (state.tab === 'trend') return await renderTrend();
    if (state.tab === 'new') return await renderHome(false, 'new');
    await renderHome();
  } catch (e) { showErr(e); }
}
async function renderHome(force, tab = 'home') {
  chips(tab === 'home' ? '🔥 盛り上がっている動画' : '最近アップロードされた動画');
  // ホーム＝盛り上がり順（1時間あたりの再生数）、新着＝新しい順
  const show = (vs, anim) => { if (state.tab !== tab || state.search || state.channel) return; const st = $('#main').scrollTop; $('#view').innerHTML = grid(tab === 'home' ? [...vs].sort((a, b) => heat(b) - heat(a)) : vs); if (!anim) { $('#view .grid')?.classList.add('noanim'); $('#main').scrollTop = st; } };
  const old = ls.get('homeCache');
  const fresh = !force && old && old.t > Date.now() - 10 * 60e3;
  if (old?.v?.length) { show(old.v, true); if (fresh) return; }
  else loading();
  // 古い一覧を見ている間に、裏で新しい一覧を取ってきて差し替える
  const vs = await homeFeed(true, (d, n) => { const p = $('#prog'); if (p) p.textContent = `登録チャンネルを確認中… ${d} / ${n}`; });
  show(vs, !old?.v?.length);
}
async function renderSearch() {
  $('#chips').innerHTML = `<button class="chip on">「${esc(state.search)}」の検索結果</button><button class="chip" id="clr">✕ 閉じる</button>`;
  $('#clr').onclick = () => { state.search = ''; $('#q').value = ''; route(); };
  loading();
  const key = 'search:' + state.search;
  let vs = JSON.parse(sessionStorage.getItem(key) || 'null');
  if (!vs) {
    const j = await yt('search', { part: 'snippet', type: 'video', q: state.search, maxResults: 30, regionCode: 'JP', relevanceLanguage: 'ja' });
    vs = (await videosByIds(j.items.map(x => x.id.videoId))).filter(v => !isShort(v)).map(slimV);
    await fillIcons(vs);
    sessionStorage.setItem(key, JSON.stringify(vs));
  }
  $('#view').innerHTML = grid(vs);
}
async function renderTrend() {
  chips('急上昇（登録していないチャンネル）');
  loading();
  const c = JSON.parse(sessionStorage.getItem('trend') || 'null');
  let vs = c && c.t > Date.now() - 15 * 60e3 ? c.v : null;
  if (!vs) {
    const mine = new Set((ls.get('subs')?.list || []).map(x => x.id));
    let raw = [], page = '';
    for (let n = 0; n < 2; n++) {
      const j = await yt('videos', { part: 'snippet,contentDetails,statistics,player', maxHeight: 360, chart: 'mostPopular', regionCode: 'JP', maxResults: 50, pageToken: page });
      raw.push(...j.items); page = j.nextPageToken; if (!page) break;
    }
    vs = raw.filter(v => !isShort(v) && !mine.has(v.snippet.channelId)).map(slimV).sort((a, b) => heat(b) - heat(a));
    await fillIcons(vs).catch(() => {});
    sessionStorage.setItem('trend', JSON.stringify({ t: Date.now(), v: vs }));
  }
  if (state.tab === 'trend' && !state.search && !state.channel) $('#view').innerHTML = grid(vs);
}
async function renderChannel() {
  const isSub = () => (ls.get('subs')?.list || []).some(x => x.id === state.channel.id);
  const btn = () => isSub() ? '<button class="chip" id="subb">✓ 登録済み（解除）</button>' : '<button class="chip on" id="subb">＋ チャンネル登録</button>';
  const drawHead = () => {
    $('#chips').innerHTML = `<button class="chip on">${esc(state.channel.name)}</button>${btn()}<button class="chip" id="clr">✕ 戻る</button>`;
    $('#clr').onclick = () => { state.channel = null; route(); };
    $('#subb').onclick = async () => {
      if (!loggedIn()) { toast('Googleにログインします'); return loginRedirect(false); }
      const ch = { ...state.channel };
      try {
        $('#subb').disabled = true;
        if (isSub()) {
          if (!confirm(`「${ch.name}」の登録を解除しますか？`)) { $('#subb').disabled = false; return; }
          await setSubscribed(ch, false); toast('登録を解除しました');
        } else { await setSubscribed(ch, true); toast('チャンネル登録しました'); }
      } catch (e) {
        if (/insufficient|forbidden|HTTP 401/i.test(e.message)) { toast('登録の許可をもらいにGoogleへ移動します'); return setTimeout(() => loginRedirect(false), 900); }
        toast('できませんでした（' + e.message + '）');
      }
      if (state.channel?.id === ch.id) drawHead();
    };
  };
  drawHead();
  loading();
  const ids = await channelVideos(state.channel.id, 40);
  const vs = (await videosByIds(ids)).filter(v => !isShort(v)).map(slimV);
  $('#view').innerHTML = grid(vs);
}
// チャンネル登録・解除（YouTube本体に反映）
async function ytWrite(method, path, params, body) {
  const u = new URL(API + path);
  Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
  const r = await fetch(u, { method, headers: { Authorization: 'Bearer ' + token.v, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) { let j = {}; try { j = await r.json(); } catch {} throw new Error(j.error?.errors?.[0]?.reason || ('HTTP ' + r.status)); }
  return r.status === 204 ? null : r.json();
}
async function setSubscribed(ch, on) {
  const c = ls.get('subs') || { t: Date.now(), list: [] };
  if (on) {
    await ytWrite('POST', 'subscriptions', { part: 'snippet' }, { snippet: { resourceId: { kind: 'youtube#channel', channelId: ch.id } } });
    c.list.push({ id: ch.id, title: ch.name, icon: iconOf(ch.id) });
  } else {
    const j = await yt('subscriptions', { part: 'id', mine: true, forChannelId: ch.id });
    if (j.items?.[0]) await ytWrite('DELETE', 'subscriptions', { id: j.items[0].id });
    c.list = c.list.filter(x => x.id !== ch.id);
  }
  ls.set('subs', c); ls.del('homeCache'); sessionStorage.removeItem('trend');
}
function renderMe() {
  $('#chips').innerHTML = '';
  const n = ls.get('subs')?.list?.length || 0;
  $('#view').innerHTML = `<div class="msg">${loggedIn()
    ? 'ログイン中です。\n登録チャンネル：' + n + '件\n<button class="btn ghost" id="rf">登録チャンネルを取り込み直す</button>\n<button class="btn ghost" id="lo">ログアウト</button>'
    : (n ? '登録チャンネル：' + n + '件（取り込み済み）\nログインなしで新着を見られます。\nチャンネルを登録・解除したときだけ、下のボタンで取り込み直してください。\n<button class="btn" id="lg">ログインして取り込み直す</button>'
         : 'ログインしていません。\n<button class="btn" id="lg">Googleでログイン</button>')}
\n<button class="btn ghost" id="hc">視聴済みの記録を消す</button></div>`;
  $('#lg')?.addEventListener('click', login);
  $('#lo')?.addEventListener('click', logout);
  $('#rf')?.addEventListener('click', () => { ls.del('homeCache'); ls.del('subs'); state.tab = 'home'; route(); });
  $('#hc').onclick = () => { ls.del('seen'); toast('消しました'); };
}

/* ============ 再生 ============ */

  sk.addEventListener('touchmove', e => { e.preventDefault(); e.stopPropagation(); if (seeking) seekPos(e.touches[0].clientX); }, { passive: false });
  sk.addEventListener('touchend', e => { e.stopPropagation(); seekEnd(); });
  sk.addEventListener('mousedown', e => { if (Date.now() - lastTouch < 800) return; seekStart(e.clientX); const mv = ev => seekPos(ev.clientX), up = () => { seekEnd(); removeEventListener('mousemove', mv); removeEventListener('mouseup', up); }; addEventListener('mousemove', mv); addEventListener('mouseup', up); });
  // 動画の上：タップ・ダブルタップ・長押し・スワイプ
  el.addEventListener('touchstart', e => {
    lastTouch = Date.now();
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; t0 = Date.now(); lp = false;
    clearTimeout(lpT);
    lpT = setTimeout(() => { if (y0 === null || !ready || !playing()) return; lp = true; hideUI(); player.setPlaybackRate(2); $('#rate').classList.add('show'); }, 500);
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (y0 === null) return;
    if (Math.abs(e.touches[0].clientY - y0) > 10 || Math.abs(e.touches[0].clientX - x0) > 10) clearTimeout(lpT);
  }, { passive: true });
  const end = e => {
    lastTouch = Date.now();
    clearTimeout(lpT);
    if (lp) { lp = false; y0 = null; try { player.setPlaybackRate(+$('#spd').textContent.replace('x', '') || 1); } catch {} $('#rate').classList.remove('show'); return; }
    if (y0 === null) return;
    const t = e.changedTouches[0], dy = t.clientY - y0, dx = t.clientX - x0; y0 = null;
    if (dy < -50 && Math.abs(dy) > Math.abs(dx)) { if (!isFs()) fullscreen(); return; }
    if (dy > 50 && isFs()) { exitFs(); return; }
    if (Math.abs(dy) < 12 && Math.abs(dx) < 12 && Date.now() - t0 < 450) { const r = el.getBoundingClientRect(); tapAt(t.clientX - r.left, r.width); }
  };
  el.addEventListener('click', e => { if (Date.now() - lastTouch < 800) return; const r = el.getBoundingClientRect(); tapAt(e.clientX - r.left, r.width); });
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', end);
})();
dragDown($('#info'), () => $('#info').scrollTop <= 0);
let fsUp = null;
$('#topbar').addEventListener('touchstart', e => { fsUp = e.touches[0].clientY; }, { passive: true });
$('#topbar').addEventListener('touchend', e => { if (fsUp !== null && fsUp - e.changedTouches[0].clientY > 50) fullscreen(); fsUp = null; });

// 小窓：上スワイプ→戻す／下スワイプ→閉じる／タップ→戻す
(() => {
  const h = $('#hit'), p = $('#pane'); let y0 = null, x0 = 0, t0 = 0, dy = 0, act = false;
  h.addEventListener('touchstart', e => { if (e.target.closest('.mb')) { y0 = null; return; } y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; t0 = Date.now(); dy = 0; act = false; }, { passive: true });
  h.addEventListener('touchmove', e => {
    if (y0 === null) return; dy = e.touches[0].clientY - y0;
    if (!act && Math.abs(dy) > 8) { act = true; p.classList.add('dragging'); }
    if (!act) return; e.preventDefault();
    const d = Math.max(-40, dy);
    p.style.transform = `translateY(${d}px)`; p.style.opacity = d > 0 ? Math.max(0, 1 - d / 160) : 1;
  }, { passive: false });
  h.addEventListener('touchend', e => {
    if (y0 === null) return; y0 = null; p.classList.remove('dragging');
    if (act && dy > 60) {
      // 下へ流しながら薄くして消す
      p.classList.add('flip'); p.style.transition = 'transform .28s ease-in, opacity .28s ease-in';
      p.style.transform = `translateY(${dy + 120}px)`; p.style.opacity = 0;
      setTimeout(() => { closePlayer(); p.style.transition = ''; p.style.transform = ''; p.style.opacity = ''; p.classList.remove('flip'); }, 290);
      return;
    }
    if (act && dy < -40) { p.style.transform = ''; p.style.opacity = ''; setMode('full'); return; }
    p.classList.add('flip'); p.style.transform = ''; p.style.opacity = '';
    if (!act && Date.now() - t0 < 400 && Math.abs(e.changedTouches[0].clientX - x0) < 10) setMode('full');
  });
})();
$('#hit').addEventListener('click', e => { if (!e.target.closest('.mb')) setMode('full'); });
$('#mpp').onclick = e => { e.stopPropagation(); if (!ready) return; player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo(); };
$('#mx').onclick = e => { e.stopPropagation(); closePlayer(); };
$('#down').onclick = minimize;
$('#fs').onclick = fullscreen;
addEventListener('popstate', () => { if (mode === 'max') setMode('full'); else if (mode === 'full') minimize(); });
addEventListener('resize', place);
new ResizeObserver(place).observe($('#slot'));
addEventListener('orientationchange', () => setTimeout(place, 300));
$('#watch').addEventListener('transitionend', place);

/* ============ クリック ============ */
document.addEventListener('click', e => {
  const c = e.target.closest('[data-ch]');
  if (c) { e.stopPropagation(); state.channel = { id: c.dataset.ch, name: c.dataset.name || '' }; state.search = ''; if (mode === 'full' || mode === 'max') minimize(); route(); return; }
  if (e.target.closest('#cmcard')) { $('#cmpanel').classList.add('open'); return; }
  if (e.target.closest('#cmx')) { $('#cmpanel').classList.remove('open'); return; }
  const v = e.target.closest('[data-v]'); if (v) return openVideo(v.dataset.v);
  const ch = e.target.closest('[data-chip]'); if (ch) { state.chip = ch.dataset.chip; route(); return; }
  const t = e.target.closest('[data-tab]');
  if (t) { state.tab = t.dataset.tab; state.search = ''; state.channel = null; if (t.dataset.tab === 'home') state.chip = state.chip || 'all'; route(); return; }
  if (e.target.closest('#vhead') && $('#desc')) { $('#desc').classList.toggle('open'); $('#vhead').classList.toggle('open'); }
});
$('#logo').onclick = () => { state.tab = 'home'; state.chip = 'all'; state.search = ''; state.channel = null; route(); };
$('#sf').onsubmit = e => { e.preventDefault(); const q = $('#q').value.trim(); if (!q) return; $('#q').blur(); state.search = q; state.channel = null; route(); };

/* ============ 起動 ============ */
const waitG = setInterval(() => { if (initAuth()) clearInterval(waitG); }, 300);
setTimeout(() => clearInterval(waitG), 15000);
if (autoLogin()) route();
// ホーム画面アプリでも更新がすぐ反映されるように、新しい版があれば読み直す
const VERSION = '31';
fetch('version.txt?' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(t => { t = t.trim(); if (t && t !== VERSION && new URLSearchParams(location.search).get('v') !== t) location.replace(location.pathname + '?v=' + t); }).catch(() => {});
</script>
