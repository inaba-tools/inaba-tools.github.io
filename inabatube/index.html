<style>
:root{--bg:#0b0b0c;--panel:#141416;--card:#1b1b1e;--line:#ffffff14;--text:#f3efe9;--sub:#a59e94;--accent:#ff8a3d;--accent2:#2b2118;--r:6px;--font:-apple-system,"Hiragino Sans",sans-serif;--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%;background:var(--bg);color:var(--text);font-family:var(--font)}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block}
.hidden{display:none!important}

/* ===== header ===== */
body{display:flex;flex-direction:column;height:100dvh}
header{position:relative;flex:none;z-index:10;display:flex;align-items:center;gap:16px;padding:calc(var(--st) + 14px) 24px 10px;background:linear-gradient(var(--bg) 80%,#0b0b0c00)}
.logo{font-weight:800;font-size:22px;letter-spacing:.01em;white-space:nowrap}
.logo span{color:var(--accent)}
#sf{position:absolute;left:50%;transform:translateX(-50%);width:min(560px,46vw);display:flex;gap:8px}
#q{flex:1;font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 18px;color:var(--text);outline:none}
#q:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;padding:2px 24px 14px;overflow:auto;scrollbar-width:none}
.chip{white-space:nowrap;background:var(--panel);padding:8px 16px;border-radius:999px;font-size:14px}
.chip.on{background:var(--accent);color:#000;font-weight:700}

/* ===== grid ===== */
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:110px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 18px;padding:0 24px}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.v{text-align:left;width:100%}
.th{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--card)}
.th img{width:100%;height:100%;object-fit:cover}
.th i{position:absolute;right:7px;bottom:7px;background:#000d;color:#fff;font-style:normal;font-size:12px;font-weight:600;padding:2px 6px;border-radius:4px}
.th .seen{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent)}
.meta{display:flex;gap:10px;margin-top:10px}
.av{width:36px;height:36px;border-radius:50%;flex:none;background:var(--accent2);object-fit:cover}
.t{font-size:15px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.4}
.msg{padding:60px 24px;text-align:center;color:var(--sub);line-height:1.9;white-space:pre-line}
.btn{display:inline-block;background:var(--accent);color:#000;font-weight:700;padding:12px 24px;border-radius:999px;font-size:16px;margin-top:16px}
.btn.ghost{background:var(--panel);color:var(--text)}
.sec{padding:4px 24px 12px;font-size:18px;font-weight:700}

/* channels list */
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:0 24px}
.ch{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:var(--r);padding:12px;text-align:left}
.ch img{width:44px;height:44px;border-radius:50%}
.ch b{font-size:14px;font-weight:600;line-height:1.35}

/* ===== tabs ===== */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:80px;padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--panel);border-top:1px solid var(--line)}
.tabs button{font-size:12px;color:var(--sub);text-align:center;min-width:72px}
.tabs button.on{color:var(--accent);font-weight:700}
.tabs b{display:block;font-size:21px;margin-bottom:2px}

/* ===== watch ===== */
#watch{position:fixed;inset:0;overflow:hidden;z-index:30;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) 340px;transform:translateY(0);transition:transform .28s ease}
#watch.away{transform:translateY(100%);pointer-events:none}
@media (max-width:900px){#watch{grid-template-columns:1fr}#side{display:none}}
#left{display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:0 16px}
#topbar{display:none!important;position:fixed;z-index:42;left:0;top:0;width:calc(100% - 340px);height:calc(var(--st) + 48px);display:flex;align-items:flex-end;gap:6px;padding:0 10px 4px;touch-action:none}
@media (max-width:900px){#topbar{width:100%}}
#topbar::after{content:'';position:absolute;left:50%;bottom:16px;width:56px;height:5px;margin-left:-28px;border-radius:9px;background:#ffffff40}
#topbar button{width:44px;height:40px;font-size:22px;border-radius:8px}
#slot{flex:none;width:min(100%,calc((100dvh - var(--st) - 130px) * 16 / 9));align-self:center;aspect-ratio:16/9;margin-top:calc(var(--st) + 12px)}
#info{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px 0 40px}
#vt{font-size:19px;font-weight:700;line-height:1.45;margin:0}
#vs{font-size:13px;color:var(--sub);margin-top:6px}
.chrow{display:flex;align-items:center;gap:12px;margin:14px 0}
.chrow img{width:42px;height:42px;border-radius:50%}
.chrow b{font-size:15px}
.desc{background:var(--panel);border-radius:var(--r);padding:12px 14px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:4.9em;overflow:hidden;position:relative}
.desc.open{max-height:none}
.desc a{color:var(--accent)}
.cmh{font-size:16px;font-weight:700;margin:22px 0 10px}
/* 右側：関連動画の上のコメント欄（押すと上下にスライドで開閉） */
#cmbox{background:var(--panel);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.cmbar{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;font-size:15px;font-weight:700;text-align:left}
.cmbar i{font-style:normal;color:var(--sub);transition:transform .35s var(--ease)}
#cmbox.open .cmbar i{transform:rotate(180deg)}
.cmbody{max-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:0 14px;transition:max-height .45s var(--ease),padding .45s var(--ease)}
#cmbox.open .cmbody{max-height:55dvh;padding:0 14px 10px}
.cmbody .s{white-space:pre-line;padding:6px 0 10px}
.cm{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.cm img{width:32px;height:32px;border-radius:50%;flex:none}
.cm .n{font-size:12px;color:var(--sub)}
.cm .x{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-top:2px}
#side{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;padding:calc(var(--st) + 12px) 16px 40px 0}
.rv{display:flex;gap:10px;margin-bottom:14px;text-align:left;width:100%}
.rv .th{width:150px;flex:none}
.rv .t{font-size:13px}
.rv .s{font-size:12px}

/* ===== player pane (moves between watch slot and mini) ===== */
#pane{position:fixed;z-index:40;background:#000;overflow:hidden;border-radius:var(--r);left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform;backface-visibility:hidden}
#pane.max{z-index:65;border-radius:0}
#pane.mini{box-shadow:0 14px 44px #000c;outline:2px solid var(--accent)}
#pl,#pane iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#hit{position:absolute;inset:0;z-index:2;display:none}
#vtouch{position:absolute;left:0;right:0;top:0;bottom:22%;z-index:2;touch-action:none}
#pane.mini #vtouch{display:none}
#pane.mini #hit{display:block;background:linear-gradient(#0000 55%,#000a)}
#hit .mb{position:absolute;bottom:8px;width:40px;height:40px;border-radius:50%;background:#000a;font-size:18px;color:#fff;display:grid;place-items:center}
#mpp{left:10px}
#mx{right:10px}
#hint{position:absolute;left:58px;right:58px;bottom:16px;font-size:11px;color:#ddd;text-align:center;pointer-events:none}
#pane.gone{opacity:0;pointer-events:none}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:60;background:#000e;border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-size:14px}

/* ===== アニメーション ===== */
:root{--spring:cubic-bezier(.22,1.2,.36,1);--ease:cubic-bezier(.2,.8,.2,1)}
/* C: 押すと少し沈む */
button{transition:transform .18s var(--ease),background-color .2s,color .2s,opacity .2s}
button:active{transform:scale(.95)}
.v:active,.rv:active,.ch:active{transform:scale(.97)}
.v .th img,.rv .th img{transition:transform .35s var(--ease),filter .35s}
.v:active .th img{transform:scale(1.04);filter:brightness(1.12)}
.chip{transition:transform .18s var(--ease),background-color .25s,color .25s}
.chip.on{animation:pop .35s var(--spring)}
@keyframes pop{0%{transform:scale(.88)}100%{transform:scale(1)}}
.tabs button b{transition:transform .3s var(--spring)}
.tabs button.on b{animation:bounce .45s var(--spring)}
@keyframes bounce{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-6px) scale(1.18)}100%{transform:translateY(0) scale(1)}}
/* A: カードが順番にふわっと出る */
.grid>.v,.chs>.ch,.side-in>.rv,.cm{opacity:0;animation:rise .5s var(--ease) forwards;animation-delay:calc(min(var(--i,0),18) * 35ms)}
.grid.noanim>.v{animation:none;opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
/* A: タブ切り替えでスッと流れる */
#view.slide-l{animation:slideL .38s var(--ease)}
#view.slide-r{animation:slideR .38s var(--ease)}
#view.fade{animation:fadeUp .35s var(--ease)}
@keyframes slideL{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg{animation:fadeUp .4s var(--ease)}
/* C: 読み込み中はオレンジの光が流れる */
.sk .th,.sk .l{position:relative;overflow:hidden;background:var(--card)}
.sk .l{height:13px;border-radius:4px;margin-top:10px}
.sk .l.w2{width:60%}
.sk .th::after,.sk .l::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,#0000,#ff8a3d22 45%,#ff8a3d44 50%,#ff8a3d22 55%,#0000);animation:sheen 1.3s ease-in-out infinite}
@keyframes sheen{to{transform:translateX(100%)}}
.loadbar{position:fixed;left:0;top:0;height:3px;width:100%;z-index:70;background:linear-gradient(90deg,#0000,var(--accent),#0000);background-size:50% 100%;background-repeat:no-repeat;animation:bar 1s linear infinite;pointer-events:none}
@keyframes bar{from{background-position:-50% 0}to{background-position:150% 0}}
/* 再生画面の出入りをバネっぽく */
#watch{transition:transform .42s var(--ease),opacity .3s}
#pane{transition:box-shadow .3s,opacity .25s}
#pane.flip{transition:transform .42s var(--ease),box-shadow .3s,opacity .25s}
#watch{will-change:transform;backface-visibility:hidden}
#pane.dragging,#watch.dragging{transition:none!important}
#info>*{animation:fadeUp .4s var(--ease) both}
.toast{animation:toastIn .35s var(--spring)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.grid>.v,.chs>.ch,.side-in>.rv,.cm{opacity:1}}
</style>
</head>
<body>
<header>
  <button class="logo" id="logo">inaba<span>Tube</span></button>
  <form id="sf"><input id="q" type="search" placeholder="検索" enterkeyhint="search" autocomplete="off"></form>
</header>

<main id="main">
  <div class="chips" id="chips"></div>
  <div id="view"></div>
</main>

<nav class="tabs" id="tabs">
  <button data-tab="home" class="on"><b>⌂</b>ホーム</button>
  <button data-tab="me"><b>◎</b>マイページ</button>
</nav>

<section id="watch" class="away" aria-hidden="true">
  <div id="topbar">
    <button id="down" aria-label="小さくする">⌄</button>
    <button id="fs" aria-label="全画面">⤢</button>
  </div>
  <div id="left">
    <div id="slot"></div>
    <div id="info"></div>
  </div>
  <aside id="side"></aside>
</section>

<div id="pane" class="gone">
  <div id="pl"></div>
  <div id="vtouch"></div>
  <div id="hit">
    <button class="mb" id="mpp" aria-label="再生・一時停止">❚❚</button>
    <div id="hint">上スワイプで戻す・下スワイプで閉じる</div>
    <button class="mb" id="mx" aria-label="閉じる">✕</button>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async></script>
<script src="https://www.youtube.com/iframe_api" async></script>
<script>
/* ============ 設定 ============ */
const CLIENT_ID = '610146352020-hd7mv58n38ueeslehag244ega0rrn4o4.apps.googleusercontent.com'; // Google Cloud の OAuth クライアントID（設定後に入る）
const API_KEY = 'AIzaSyBhhAe1sM3LhLUmr4MNMXF_iA0Ey4ax_zo'; // ログインなしで新着を取るためのAPIキー（inaba-tools.github.io からだけ使える制限つき）
const SCOPE = 'https://www.googleapis.com/auth/youtube.readonly';
const API = 'https://www.googleapis.com/youtube/v3/';

/* ============ 小物 ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k, d = null) { try { const v = localStorage.getItem('it_' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('it_' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('it_' + k); } catch {} }
};
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2400); }
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600) return Math.max(1, Math.floor(s / 60)) + ' 分前';
  if (s < 86400) return Math.floor(s / 3600) + ' 時間前';
  if (s < 86400 * 30) return Math.floor(s / 86400) + ' 日前';
  if (s < 86400 * 365) return Math.floor(s / 86400 / 30) + ' か月前';
  return Math.floor(s / 86400 / 365) + ' 年前';
}
function num(n) {
  n = +n || 0;
  if (n >= 1e8) return (n / 1e8).toFixed(n < 1e9 ? 1 : 0).replace(/\.0$/, '') + '億';
  if (n >= 1e4) return (n / 1e4).toFixed(n < 1e5 ? 1 : 0).replace(/\.0$/, '') + '万';
  return n.toLocaleString();
}
function secs(iso) { const m = /P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(iso || '') || []; return (+m[1]||0)*86400 + (+m[2]||0)*3600 + (+m[3]||0)*60 + (+m[4]||0); }
function dur(iso) { let s = secs(iso); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); s = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); }
const isShort = v => { const d = secs(v.contentDetails?.duration); return (d > 0 && d <= 60) || /#shorts/i.test(v.snippet?.title + ' ' + v.snippet?.description); };
const isLive = v => v.snippet?.liveBroadcastContent === 'live' || v.snippet?.liveBroadcastContent === 'upcoming';

/* ============ ログイン ============ */
let token = ls.get('token');
let tokenClient = null;
const loggedIn = () => token && token.exp > Date.now() + 60000;
function initAuth() {
  if (!CLIENT_ID || !window.google?.accounts?.oauth2) return false;
  if (!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPE,
    callback: r => {
      if (r.error) { toast('ログインできませんでした'); return; }
      token = { v: r.access_token, exp: Date.now() + (r.expires_in - 60) * 1000 };
      ls.set('token', token); ls.set('everLogged', true);
      ls.del('homeCache'); getSubs(true).catch(() => {}).finally(() => { state.tab = 'home'; route(); });
    }
  });
  return true;
}
/* ページごとGoogleへ移動してログインし、自動で戻ってくる（ボタンを押さなくても開いた時点で動く） */
const REDIRECT = 'https://inaba-tools.github.io/inabatube/'; // Google Cloud に登録した戻り先と完全に同じにする
function loginRedirect(silent) {
  if (!CLIENT_ID) return;
  const st = Math.random().toString(36).slice(2);
  try { sessionStorage.setItem('it_state', st); sessionStorage.setItem('it_try', silent ? 'silent' : 'full'); } catch {}
  const u = new URL('https://accounts.google.com/o/oauth2/v2/auth');
  Object.entries({ client_id: CLIENT_ID, redirect_uri: REDIRECT, response_type: 'token', scope: SCOPE,
    include_granted_scopes: 'true', state: st, prompt: silent ? 'none' : 'select_account' }).forEach(([k, v]) => u.searchParams.set(k, v));
  location.replace(u);
}
function takeRedirectResult() {
  if (!location.hash.includes('state=')) return null;
  const h = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', REDIRECT);
  let st = null, tried = null;
  try { st = sessionStorage.getItem('it_state'); tried = sessionStorage.getItem('it_try'); sessionStorage.removeItem('it_state'); } catch {}
  if (h.get('state') !== st) return null;
  if (h.get('access_token')) {
    token = { v: h.get('access_token'), exp: Date.now() + ((+h.get('expires_in') || 3600) - 60) * 1000 };
    ls.set('token', token); ls.set('everLogged', true); ls.del('homeCache');
    try { sessionStorage.removeItem('it_try'); } catch {}
    return 'ok';
  }
  // Googleのログインが残っていなかったときは、アカウント選択画面へ（1回だけ）
  if (tried === 'silent') return 'needFull';
  try { sessionStorage.removeItem('it_try'); } catch {}
  return 'fail';
}
function autoLogin() {
  const r = takeRedirectResult();
  if (r === 'ok') return true;
  if (r === 'needFull') { loginRedirect(false); return false; }
  if (r === 'fail') return true; // 失敗したらループさせずにボタン表示に戻す
  if (!hasSubs() && !loggedIn() && CLIENT_ID) { loginRedirect(true); return false; }
  return true;
}
function login() {
  if (!CLIENT_ID) { toast('Googleの設定がまだです'); return; }
  return loginRedirect(false);
  if (!initAuth()) { toast('読み込み中です。\nもう一度押してください'); return; }
  tokenClient.requestAccessToken({ prompt: ls.get('everLogged') ? '' : 'consent' });
}
function logout() {
  if (token && window.google?.accounts?.oauth2) google.accounts.oauth2.revoke(token.v, () => {});
  token = null; ls.del('token'); ls.del('everLogged'); ls.del('homeCache'); ls.del('subs');
  route();
}

/* ============ API ============ */
const hasSubs = () => !!ls.get('subs')?.list?.length;
const canUse = () => loggedIn() || (API_KEY && hasSubs());
async function yt(path, params) {
  setBusy(true);
  try { return await ytRaw(path, params); } finally { setBusy(false); }
}
async function ytRaw(path, params) {
  const useToken = loggedIn();
  if (!useToken && (params.mine || !API_KEY)) throw new Error('login');
  const u = new URL(API + path);
  Object.entries(params).forEach(([k, v]) => v !== undefined && v !== '' && u.searchParams.set(k, v));
  if (!useToken) u.searchParams.set('key', API_KEY);
  const r = await fetch(u, useToken ? { headers: { Authorization: 'Bearer ' + token.v } } : { referrerPolicy: 'no-referrer-when-downgrade' });
  if (r.status === 401 && useToken) { token = null; ls.del('token'); return ytRaw(path, params); }
  const j = await r.json();
  if (!r.ok) { const e = new Error(j.error?.errors?.[0]?.reason || 'api'); e.code = r.status; throw e; }
  return j;
}
async function videosByIds(ids) {
  const chunks = [];
  for (let i = 0; i < ids.length; i += 50) chunks.push(ids.slice(i, i + 50));
  const res = await Promise.all(chunks.map(c => yt('videos', { part: 'snippet,contentDetails,statistics', id: c.join(','), maxResults: 50 })));
  return res.flatMap(j => j.items);
}
async function pool(items, n, fn) {
  const res = []; let i = 0;
  await Promise.all(Array.from({ length: n }, async () => { while (i < items.length) { const k = i++; try { res[k] = await fn(items[k]); } catch { res[k] = null; } } }));
  return res;
}
async function getSubs(force) {
  const c = ls.get('subs');
  // 一度取り込んだ一覧はずっと使う（ログイン中だけ6時間ごとに自動で取り直す）
  if (c && (!loggedIn() || (!force && c.t > Date.now() - 6 * 3600e3))) return c.list;
  const list = []; let page = '';
  for (let n = 0; n < 6; n++) {
    const j = await yt('subscriptions', { part: 'snippet', mine: true, maxResults: 50, order: 'alphabetical', pageToken: page });
    j.items.forEach(s => list.push({ id: s.snippet.resourceId.channelId, title: s.snippet.title, icon: s.snippet.thumbnails?.default?.url }));
    page = j.nextPageToken; if (!page) break;
  }
  ls.set('subs', { t: Date.now(), list });
  return list;
}
const uploads = id => 'UU' + id.slice(2);
async function channelVideos(chId, n) {
  const j = await yt('playlistItems', { part: 'contentDetails', playlistId: uploads(chId), maxResults: n });
  return j.items.map(x => x.contentDetails.videoId);
}
async function homeFeed(force, onPart) {
  const c = ls.get('homeCache');
  if (!force && c && c.t > Date.now() - 10 * 60e3) return c.v;
  const subs = await getSubs(force);
  // 取れた分から順に表示する（全部そろうのを待たない）
  const all = new Map(); let queue = [], last = 0;
  const sorted = () => [...all.values()].sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, 240);
  const flush = async (final) => {
    const ids = [...new Set(queue.splice(0))].filter(id => !all.has(id));
    if (ids.length) (await videosByIds(ids)).filter(v => !isShort(v)).forEach(v => all.set(v.id, slimV(v)));
    if (onPart && all.size && (final || Date.now() - last > 700)) { last = Date.now(); onPart(sorted()); }
  };
  await pool(subs.slice(0, 150), 24, async s => {
    queue.push(...(await channelVideos(s.id, 4)));
    if (queue.length >= 50) await flush();
  });
  await flush(true);
  const slim = sorted();
  ls.set('homeCache', { t: Date.now(), v: slim });
  return slim;
}
function slimV(v) {
  return { id: v.id, title: v.snippet.title, ch: v.snippet.channelTitle, chId: v.snippet.channelId, at: v.snippet.publishedAt,
    views: v.statistics?.viewCount, likes: v.statistics?.likeCount, dur: v.contentDetails?.duration, live: isLive(v),
    thumb: v.snippet.thumbnails?.medium?.url || `https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`, desc: v.snippet.description };
}
const iconOf = chId => (ls.get('subs')?.list || []).find(s => s.id === chId)?.icon || ls.get('icons', {})[chId] || '';
async function fillIcons(vs) {
  const need = [...new Set(vs.map(v => v.chId))].filter(id => !iconOf(id));
  if (!need.length) return;
  const map = ls.get('icons', {});
  for (let i = 0; i < need.length; i += 50) {
    const j = await yt('channels', { part: 'snippet', id: need.slice(i, i + 50).join(','), maxResults: 50 });
    j.items.forEach(c => map[c.id] = c.snippet.thumbnails?.default?.url);
  }
  ls.set('icons', map);
}

let player = null, ready = false, pending = null, mode = 'none', current = null;
window.onYouTubeIframeAPIReady = () => {

// 位置と大きさは一度で最終形にして、見た目だけ transform で前の位置から動かす（毎コマの再計算をしないので滑らか）
function flip(p, to) {
  const from = p.getBoundingClientRect();
  const same = Math.abs(from.left - to.left) < 1 && Math.abs(from.top - to.top) < 1 && Math.abs(from.width - to.width) < 1;
  if (same) return;
  p.classList.remove('flip'); p.style.transform = ''; p.style.transformOrigin = '';
  Object.assign(p.style, { left: to.left + 'px', top: to.top + 'px', width: to.width + 'px', height: to.height + 'px' });
  if (!from.width || p.classList.contains('gone')) return;
  p.style.transform = `translate(${from.left - to.left}px,${from.top - to.top}px) scale(${from.width / to.width},${from.height / to.height})`;
  void p.offsetWidth;
  p.classList.add('flip'); p.style.transform = '';
}
function place() {
  const p = $('#pane');
  if (mode === 'none') { p.classList.add('gone'); return; }
  p.classList.remove('gone');
  if (mode === 'max') {
    flip(p, { left: 0, top: 0, width: innerWidth, height: innerHeight });
    p.classList.remove('mini'); p.classList.add('max');
    return;
  }
  p.classList.remove('max');
  if (mode === 'full') {
    // 再生画面がスライド中でも、止まった後の位置を先に計算して、そこへ一直線に動かす
    const w = $('#watch'), tf = w.style.transform, tr = w.style.transition;
    w.style.transition = 'none'; w.style.transform = 'none';
    const r = $('#slot').getBoundingClientRect();
    w.style.transform = tf; void w.offsetWidth; w.style.transition = tr;
    flip(p, { left: r.left, top: r.top, width: r.width, height: r.height });
    p.classList.remove('mini');
  } else {
    const w = Math.min(380, innerWidth * 0.42), h = w * 9 / 16;
    flip(p, { left: innerWidth - w - 20, top: innerHeight - h - 96, width: w, height: h });
    p.classList.add('mini');
  }
}
function setMode(m) {
  mode = m;
  $('#watch').classList.toggle('away', m !== 'full' && m !== 'max');
  $('#watch').setAttribute('aria-hidden', m !== 'full');
  place();
}
function openVideo(id) {

function minimize() { if (mode === 'full') setMode('mini'); }
function closePlayer() { try { player.stopVideo(); } catch {} setMode('none'); }

function linkify(t) { return esc(t).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`); }

async function loadComments(id) {

async function loadRelated(v) {
  const key = 'rel:' + v.id;
  let vs = JSON.parse(sessionStorage.getItem(key) || 'null');
  if (!vs) {
    const same = await channelVideos(v.chId, 8).catch(() => []);
    const q = v.title.replace(/[【】\[\]「」『』()（）|｜#＃!！?？]/g, ' ').split(/\s+/).filter(w => w.length > 1).slice(0, 4).join(' ');
    const sr = q ? await yt('search', { part: 'snippet', type: 'video', q, maxResults: 20, regionCode: 'JP', relevanceLanguage: 'ja' }).catch(() => ({ items: [] })) : { items: [] };
    const ids = [...new Set([...same, ...sr.items.map(x => x.id.videoId)])].filter(x => x !== v.id);
    vs = (await videosByIds(ids)).filter(x => !isShort(x)).map(slimV);
    sessionStorage.setItem(key, JSON.stringify(vs));
  }
  if (current?.id !== v.id) return;
  await fillIcons(vs).catch(() => {});
  vs.forEach(x => cache[x.id] = x);
  $('#rel').classList.add('side-in');
  $('#rel').innerHTML = vs.map((x, i) => `<button class="rv" style="--i:${i}" data-v="${esc(x.id)}"><div class="th">${thumbImg(esc(x.id))}<i>${x.live ? 'ライブ' : esc(dur(x.dur))}</i></div><div><div class="t">${esc(x.title)}</div><div class="s">${esc(x.ch)}<br>${num(x.views)}回 ・ ${ago(x.at)}</div></div></button>`).join('') || '<div class="s">関連動画が見つかりませんでした。</div>';
}

/* ============ スワイプ ============ */
function swipe(el, { up, down, tap }) {
  let y0 = null, x0 = 0, t0 = 0;
  el.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; t0 = Date.now(); }, { passive: true });
  el.addEventListener('touchend', e => {
    if (y0 === null) return;
    const dy = e.changedTouches[0].clientY - y0, dx = e.changedTouches[0].clientX - x0; y0 = null;
    if (Math.abs(dy) > 50 && Math.abs(dy) > Math.abs(dx)) { (dy > 0 ? down : up)?.(); e.preventDefault(); }
    else if (Math.abs(dy) < 10 && Math.abs(dx) < 10 && Date.now() - t0 < 400 && tap && !e.target.closest('.mb')) { tap(); e.preventDefault(); }
  });
}
// 再生画面を下に引っぱると、指について動いて小窓に縮む
function dragDown(el, canStart = () => true) {
  let y0 = null, dy = 0, active = false;
  const w = $('#watch'), p = $('#pane');
  el.addEventListener('touchstart', e => { if (mode !== 'full' || !canStart()) { y0 = null; return; } y0 = e.touches[0].clientY; dy = 0; active = false; }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (!active && dy > 8) { active = true; w.classList.add('dragging'); p.classList.add('dragging'); }
    if (!active) return;
    e.preventDefault();
    const d = Math.max(0, dy), k = Math.min(1, d / (innerHeight * 0.6));
    w.style.transform = `translateY(${d}px)`; w.style.opacity = 1 - k * 0.6;
    p.style.transform = `translateY(${d}px) scale(${1 - k * 0.45})`; p.style.transformOrigin = 'right top';
  }, { passive: false });
  el.addEventListener('touchend', () => {
    if (y0 === null) return; y0 = null;
    if (!active) return;
    w.classList.remove('dragging'); p.classList.remove('dragging');
    w.style.transform = ''; w.style.opacity = '';
    if (dy > 90) { minimize(); return; }
    p.classList.add('flip'); p.style.transform = ''; p.style.transformOrigin = '';
  });
}
let wasPlaying = false, fsChangedAt = 0;
const markFs = () => { fsChangedAt = Date.now(); };
['fullscreenchange', 'webkitfullscreenchange', 'resize'].forEach(ev => (ev === 'resize' ? window : document).addEventListener(ev, markFs));
const isFs = () => mode === 'max' || !!(document.fullscreenElement || document.webkitFullscreenElement);
function exitFs() { if (mode === 'max') { setMode('full'); return; } (document.exitFullscreen || document.webkitExitFullscreen)?.call(document); }
function togglePlay() { if (!ready) return; player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo(); }
function capsOff() { try { player.unloadModule('captions'); player.unloadModule('cc'); player.setOption('captions', 'track', {}); } catch {} }
function fullscreen() {
  const p = $('#pane'), fn = p.requestFullscreen || p.webkitRequestFullscreen;
  const fallback = () => { if (!isFs()) setMode('max'); };
  if (!fn) return fallback();
  try { const r = fn.call(p); if (r?.catch) r.catch(fallback); } catch { return fallback(); }
  setTimeout(fallback, 400); // 本物の全画面にならなかったら画面いっぱいに広げる
}
// 再生画面：上のバーと、動画の下の情報エリアの一番上で下スワイプ→小窓／上スワイプ→全画面
dragDown($('#topbar'));
dragDown($('#vtouch'), () => !isFs());
(() => {
  const el = $('#vtouch'); let y0 = null, x0 = 0, t0 = 0;
  el.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; t0 = Date.now(); }, { passive: true });
  el.addEventListener('touchend', e => {
    if (y0 === null) return;
    const dy = e.changedTouches[0].clientY - y0, dx = e.changedTouches[0].clientX - x0; y0 = null;
    if (dy < -50 && Math.abs(dy) > Math.abs(dx)) { isFs() ? null : fullscreen(); return; }
    if (dy > 50 && isFs()) { exitFs(); return; }
  });
})();
dragDown($('#info'), () => $('#info').scrollTop <= 0);
let fsUp = null;
$('#topbar').addEventListener('touchstart', e => { fsUp = e.touches[0].clientY; }, { passive: true });
$('#topbar').addEventListener('touchend', e => { if (fsUp !== null && fsUp - e.changedTouches[0].clientY > 50) fullscreen(); fsUp = null; });

// 小窓：上スワイプ→戻す／下スワイプ→閉じる／タップ→戻す
swipe($('#hit'), { up: () => setMode('full'), down: closePlayer, tap: () => setMode('full') });
$('#hit').addEventListener('click', e => { if (!e.target.closest('.mb')) setMode('full'); });
$('#mpp').onclick = e => { e.stopPropagation(); if (!ready) return; player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo(); };
$('#mx').onclick = e => { e.stopPropagation(); closePlayer(); };
$('#down').onclick = minimize;
$('#fs').onclick = fullscreen;
addEventListener('popstate', () => { if (mode === 'max') setMode('full'); else if (mode === 'full') minimize(); });
addEventListener('resize', place);
new ResizeObserver(place).observe($('#slot'));
addEventListener('orientationchange', () => setTimeout(place, 300));
$('#watch').addEventListener('transitionend', place);

/* ============ クリック ============ */
document.addEventListener('click', e => {
  const v = e.target.closest('[data-v]'); if (v) return openVideo(v.dataset.v);
  const c = e.target.closest('[data-ch]');
  if (c) { if (mode === 'full') minimize(); state.channel = { id: c.dataset.ch, name: c.dataset.name }; state.search = ''; route(); return; }
  const ch = e.target.closest('[data-chip]'); if (ch) { state.chip = ch.dataset.chip; route(); return; }
  const t = e.target.closest('[data-tab]');
  if (t) { state.tab = t.dataset.tab; state.search = ''; state.channel = null; if (t.dataset.tab === 'home') state.chip = state.chip || 'all'; route(); return; }
  if (e.target.closest('#desc')) $('#desc').classList.toggle('open');
});
$('#logo').onclick = () => { state.tab = 'home'; state.chip = 'all'; state.search = ''; state.channel = null; route(); };
$('#sf').onsubmit = e => { e.preventDefault(); const q = $('#q').value.trim(); if (!q) return; $('#q').blur(); state.search = q; state.channel = null; route(); };

/* ============ 起動 ============ */
const waitG = setInterval(() => { if (initAuth()) clearInterval(waitG); }, 300);
setTimeout(() => clearInterval(waitG), 15000);
if (autoLogin()) route();
// ホーム画面アプリでも更新がすぐ反映されるように、新しい版があれば読み直す
const VERSION = '19';
fetch('version.txt?' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(t => { t = t.trim(); if (t && t !== VERSION && new URLSearchParams(location.search).get('v') !== t) location.replace(location.pathname + '?v=' + t); }).catch(() => {});
</script>
</body>
</html>
