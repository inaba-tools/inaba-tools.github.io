<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="東三河">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.png">
<title>東三河の飲食店（見本）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --g:#1F6B45;--gbg:#F2F6F3;--g2:#3FA86F;--o:#B86A00;--obg:#FFF4E5;
  --line:#E8E8E8;--text:#1A1A1A;--sub:#7A7A7A;--bg:#FFFFFF;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --spring:cubic-bezier(.2,1.25,.35,1);--ease:cubic-bezier(.22,.8,.25,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#fff;color:var(--text);overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;background:#fff;overflow:hidden}
@media(min-width:600px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 100px);
  opacity:0;pointer-events:none;transform:translateY(14px) scale(.985);transition:opacity .32s var(--ease),transform .42s var(--ease);background:#fff}
.scr.on{opacity:1;pointer-events:auto;transform:none}
.press{transition:transform .18s var(--ease)}
.press:active{transform:scale(.96)}
/* 出てくる動き */
.in{opacity:0;transform:translateY(12px);animation:fin .5s var(--ease) forwards}
@keyframes fin{to{opacity:1;transform:none}}
/* ヘッダー */
.hd{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px;min-height:38px}
.hd small{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
.hd h1{font-size:22px;font-weight:800;letter-spacing:.3px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative}
.iconbtn svg{width:19px;height:19px}
.dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--o);border:2px solid #fff}
/* 歩数・ポイントの小さいカード */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mini{border-radius:16px;padding:12px 13px;position:relative;overflow:hidden}
.mini .lb{font-size:12px;font-weight:700}
.mini .v{font-size:26px;font-weight:800;margin-top:1px;letter-spacing:.3px;font-variant-numeric:tabular-nums}
.mini .v span{font-size:13px;font-weight:700;margin-left:2px}
.mini .s{font-size:11px;margin-top:1px;opacity:.85}
.mg{background:var(--gbg);color:var(--g)}
.mo{background:var(--obg);color:var(--o)}
.ring{position:absolute;right:10px;top:10px;width:40px;height:40px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:rgba(31,107,69,.14)}
.ring .fg{stroke:var(--g);stroke-linecap:round;stroke-dasharray:113;stroke-dashoffset:113;transition:stroke-dashoffset 1.4s var(--ease)}
.shine{position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.65) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3.8s ease-in-out 1.2s infinite}
@keyframes shine{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}
/* 動画のおすすめ */
.feature{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:9px 10px;margin-bottom:12px;text-align:left;width:100%}
.thumb{width:44px;height:56px;border-radius:9px;flex-shrink:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.35))}
.thumb i{position:absolute;bottom:4px;right:4px;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.9);z-index:1;display:flex;align-items:center;justify-content:center}
.feature b{font-size:14px;display:block}
.feature small{font-size:11px;color:var(--sub)}
.tag{font-size:10px;font-weight:700;color:var(--o);background:var(--obg);border-radius:5px;padding:2px 6px;margin-bottom:3px;display:inline-block}
/* 見出しと切り替え */
.sec{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}
.sec h2{font-size:16px;font-weight:800;display:flex;align-items:center;gap:6px}
.live{width:8px;height:8px;border-radius:50%;background:#22A35A;position:relative}
.live::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:#22A35A;opacity:.35;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:.5}100%{transform:scale(1.6);opacity:0}}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px;flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:#fff;transition:all .25s var(--ease);white-space:nowrap}
.chip.on{background:var(--text);border-color:var(--text);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;position:relative;flex-shrink:0}
.seg button{font-size:12.5px;font-weight:600;padding:5px 14px;border-radius:999px;color:var(--sub);position:relative;z-index:1;transition:color .25s}
.seg button.on{color:#fff}
.seg .knob{position:absolute;top:3px;bottom:3px;border-radius:999px;background:var(--text);transition:left .35s var(--spring),width .35s var(--spring)}
/* お店のカード */
.list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0;scrollbar-width:none;padding-bottom:4px}
.list::-webkit-scrollbar{display:none}
.shop{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;width:100%;background:#fff}
.em{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:19px;background:#F6F6F6}
.shop .tx{flex:1;min-width:0}
.shop .n{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop .m{font-size:11.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op{color:#1E8E4E;font-weight:700}.cl{color:#B0B0B0;font-weight:700}
.pt{font-size:13px;font-weight:800;color:var(--o);background:var(--obg);border-radius:999px;padding:5px 10px;white-space:nowrap;flex-shrink:0}
.more{font-size:13px;color:var(--g);font-weight:700;padding:9px;text-align:center;width:100%;border-radius:12px}
.empty{text-align:center;color:var(--sub);font-size:13px;line-height:1.8;padding:24px 10px}
.note{font-size:11.5px;color:var(--sub);line-height:1.7}
/* タブバー（液体ガラス） */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 10px);width:min(456px,calc(100% - 24px));height:66px;
  border-radius:33px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;touch-action:none;
  background:rgba(255,255,255,.58);backdrop-filter:blur(24px) saturate(1.9);-webkit-backdrop-filter:blur(24px) saturate(1.9);
  border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 30px rgba(0,0,0,.13),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(0,0,0,.04);z-index:40;
  transition:transform .4s var(--ease),opacity .3s}
.tabbar.hide{transform:translateX(-50%) translateY(120px);opacity:0}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:#8a8a8a;height:56px;justify-content:center;position:relative;z-index:2;transition:color .3s}
.tab svg{width:23px;height:23px;transition:transform .35s var(--spring)}
.tab.on{color:#fff}
.tab.on svg{transform:translateY(-1px) scale(1.08)}
.tind{position:absolute;top:5px;height:56px;width:56px;border-radius:28px;background:#1A1A1A;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:1;transition:left .45s var(--spring),opacity .3s}
.lens{position:absolute;top:-10px;width:78px;height:78px;border-radius:50%;z-index:3;pointer-events:none;opacity:0;transform:scale(.6);
  background:rgba(255,255,255,.25);backdrop-filter:blur(3px) saturate(2) brightness(1.08);-webkit-backdrop-filter:blur(3px) saturate(2) brightness(1.08);
  box-shadow:0 6px 18px rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.8),inset 0 8px 16px rgba(255,255,255,.5);transition:opacity .2s,transform .3s var(--spring)}
.lens.on{opacity:1;transform:scale(1)}
.scanbtn{justify-self:center;width:68px;height:68px;border-radius:50%;background:var(--g);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;gap:1px;margin-top:-28px;box-shadow:0 8px 20px rgba(31,107,69,.45);border:4px solid #fff;position:relative;z-index:4;transition:transform .3s var(--spring)}
.scanbtn svg{width:27px;height:27px}
.scanbtn::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--g2);opacity:0;animation:ripple 2.6s ease-out infinite}
@keyframes ripple{0%{transform:scale(.9);opacity:.6}70%,100%{transform:scale(1.35);opacity:0}}
.scanbtn.on{transform:scale(1.06)}
/* 地図 */
#s-map{padding:0}
#leaf{position:absolute;inset:0;background:#EEF0EC}
.mapui{position:absolute;left:0;right:0;top:0;padding:calc(var(--st) + 10px) 12px 0;z-index:500;pointer-events:none}
.mapui>*{pointer-events:auto}
.sbar{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:0 12px;height:48px;box-shadow:0 4px 18px rgba(0,0,0,.12);border:1px solid rgba(0,0,0,.04)}
.sbar svg{width:18px;height:18px;color:var(--sub);flex-shrink:0}
.sbar input{flex:1;border:0;outline:0;font-size:16px;background:transparent;min-width:0;-webkit-user-select:text;user-select:text}
.sbar .x{width:24px;height:24px;border-radius:50%;background:#EEE;font-size:13px;display:none;align-items:center;justify-content:center;color:#666}
.sbar.has .x{display:flex}
.mapui .chips{margin:8px 0 0;padding-bottom:4px}
.mapui .chip{box-shadow:0 2px 8px rgba(0,0,0,.08);border-color:transparent}
.mapui .chip.on{border-color:var(--text)}
.sug{background:#fff;border-radius:16px;margin-top:8px;box-shadow:0 8px 26px rgba(0,0,0,.14);overflow:hidden;max-height:52vh;overflow-y:auto;display:none;animation:fin .25s var(--ease)}
.sug.on{display:block}
.sg{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #F1F1F1;width:100%;text-align:left}
.sg:last-child{border-bottom:0}
.sg .em{width:32px;height:32px;font-size:16px;border-radius:50%}
.sg b{font-size:14px;display:block}
.sg small{font-size:11.5px;color:var(--sub)}
.sg.gen .em{background:var(--gbg)}
.fab{position:absolute;right:12px;z-index:500;width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;transition:bottom .4s var(--ease)}
.fab svg{width:21px;height:21px;color:#2F7BF5}
#mapcard{position:absolute;left:12px;right:12px;z-index:500;bottom:calc(var(--sb) + 90px);transform:translateY(30px);opacity:0;pointer-events:none;transition:all .45s var(--spring)}
#mapcard.on{transform:none;opacity:1;pointer-events:auto}
#mapcard .shop{box-shadow:0 8px 26px rgba(0,0,0,.16);border-color:transparent;padding:13px}
.rescount{position:absolute;left:50%;transform:translateX(-50%);z-index:500;bottom:calc(var(--sb) + 92px);background:var(--text);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:7px 14px;box-shadow:0 4px 12px rgba(0,0,0,.2);opacity:0;transition:opacity .3s;pointer-events:none}
.rescount.on{opacity:1}
.pn{width:36px;height:36px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--g);display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 8px rgba(0,0,0,.28);border:2.5px solid #fff;animation:drop .5s var(--spring) both}
.pn span{transform:rotate(45deg);font-size:16px;line-height:1}
.pn.closed{background:#A9A9A9}
.pn.sel{background:var(--o);width:44px;height:44px;animation:bounce .6s var(--spring)}
.pn.sel span{font-size:20px}
@keyframes drop{from{transform:rotate(-45deg) translate(20px,-20px) scale(.4);opacity:0}}
@keyframes bounce{0%{transform:rotate(-45deg) scale(.7)}60%{transform:rotate(-45deg) scale(1.15)}100%{transform:rotate(-45deg) scale(1)}}
.me{width:20px;height:20px;border-radius:50%;background:#2F7BF5;border:3px solid #fff;box-shadow:0 0 0 0 rgba(47,123,245,.5);animation:me 2s infinite}
@keyframes me{0%{box-shadow:0 0 0 0 rgba(47,123,245,.45)}100%{box-shadow:0 0 0 18px rgba(47,123,245,0)}}
.leaflet-control-attribution{font-size:9px!important;margin-bottom:calc(var(--sb) + 84px)!important;background:rgba(255,255,255,.6)!important}
.leaflet-control-zoom{display:none}
/* QR */
.scan{flex:1;border-radius:22px;background:#0E0E0E;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;overflow:hidden;min-height:0}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 120px,rgba(0,0,0,.55) 121px);pointer-events:none}
.frame{width:220px;height:220px;position:relative;z-index:2;animation:breath 2.4s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.03)}}
.frame i{position:absolute;width:42px;height:42px;border:4px solid #fff}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.laser{position:absolute;left:14px;right:14px;height:2px;background:#4ADE80;box-shadow:0 0 14px 2px #4ADE80;animation:sc 2.2s ease-in-out infinite}
@keyframes sc{0%,100%{top:16px}50%{top:200px}}
.scan p{margin-top:24px;font-size:14px;text-align:center;line-height:1.7;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.scan .cam{z-index:2;margin-top:14px;font-size:13px;font-weight:700;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 16px;color:#fff}
.btn{display:block;width:100%;border-radius:15px;padding:14px;font-size:15px;font-weight:800;text-align:center}
.bg{background:var(--g);color:#fff}
.bw{border:1px solid var(--line);background:#fff}
.bo{background:var(--o);color:#fff}
.bk{background:var(--text);color:#fff}
.btn:disabled{opacity:.35}
.row{display:flex;gap:8px}
.row .btn{flex:1;white-space:nowrap}
.row .btn.sm{flex:0 0 96px}
/* ポイント */
.big{border-radius:18px;background:var(--obg);color:var(--o);padding:15px 16px;margin-bottom:12px;position:relative;overflow:hidden;flex-shrink:0}
.big .v{font-size:38px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.big .v span{font-size:16px;font-weight:800}
.big .s{font-size:12px;margin-top:2px;line-height:1.6}
.bar{height:7px;border-radius:9px;background:rgba(184,106,0,.15);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--o);border-radius:9px;transition:width 1.4s var(--ease)}
.coin{position:absolute;right:-14px;top:-14px;width:96px;height:96px;border-radius:50%;background:rgba(184,106,0,.09);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:rgba(184,106,0,.25);animation:spin 7s linear infinite}
@keyframes spin{0%,80%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.hist{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);gap:10px}
.hist .t{font-size:14px;font-weight:700}
.hist .d{font-size:11.5px;color:var(--sub);margin-top:2px}
.plus{font-weight:800;color:var(--o);font-size:15px;text-align:right;white-space:nowrap}
.minus{color:#555}
.badge{display:inline-block;font-size:10px;font-weight:700;border-radius:6px;padding:2px 6px;margin-top:3px}
.wait{background:#F1F1F1;color:#777}.ok{background:var(--gbg);color:var(--g)}.ng{background:#FDECEC;color:#C0392B}
/* マイページ */
.prof{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.av{width:52px;height:52px;border-radius:50%;background:var(--gbg);display:flex;align-items:center;justify-content:center;color:var(--g);font-weight:800;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.stats small{font-size:10.5px;color:var(--sub)}
.menu{border:1px solid var(--line);border-radius:16px;overflow:hidden;flex-shrink:0}
.mi{display:flex;justify-content:space-between;align-items:center;padding:12.5px 14px;border-bottom:1px solid var(--line);font-size:14px;width:100%;text-align:left}
.mi:last-child{border-bottom:0}
.mi span{font-size:12px;color:var(--sub)}
.mi .okc{color:var(--g);font-weight:700}
/* お店のページ */
#s-shop{z-index:30;transform:translateX(100%);opacity:1;transition:transform .45s var(--ease);padding-bottom:calc(var(--sb) + 16px)}
#s-shop.on{transform:none}
.photo{height:200px;border-radius:20px;overflow:hidden;margin-bottom:12px;flex-shrink:0;position:relative}
.photo .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:76px;animation:zoom 9s ease-in-out infinite alternate}
@keyframes zoom{to{transform:scale(1.12)}}
.photo .lab{position:absolute;left:12px;bottom:10px;font-size:10px;color:rgba(255,255,255,.75)}
.photo .stat{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);border-radius:999px;font-size:11.5px;font-weight:800;padding:5px 10px;display:flex;align-items:center;gap:6px}
.fav{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:17px}
.fav.on{animation:pop .45s var(--spring)}
@keyframes pop{50%{transform:scale(1.35)}}
.sp h1{font-size:22px;font-weight:800}
.sp .meta{font-size:12.5px;color:var(--sub);margin:4px 0 12px}
.ptbox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;flex-shrink:0}
.ptbox div{border-radius:14px;padding:10px 12px}
.ptbox b{font-size:22px;font-weight:900;display:block;font-variant-numeric:tabular-nums}
.ptbox small{font-size:11px;font-weight:700}
.menu2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;flex-shrink:0}
.menu2 div{border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:700}
.menu2 small{display:block;font-size:12px;color:var(--sub);font-weight:500;margin-top:2px}
.hours{border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;flex-shrink:0;width:100%;text-align:left}
.hours .hrow{display:flex;justify-content:space-between;padding:2px 0;color:var(--sub)}
.hours .hrow.today{color:var(--text);font-weight:800}
.hours .wk{max-height:0;overflow:hidden;transition:max-height .4s var(--ease)}
.hours.open .wk{max-height:200px}
.back{font-size:15px;color:var(--g);font-weight:800;display:flex;align-items:center;gap:2px;padding:6px 0}

function nearestOpen(){return SHOPS.filter(s=>openInfo(s).open).sort((a,b)=>far(a).d-far(b).d)[0]||SHOPS[0]}
async function startCam(){
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
  const v=$("vid");v.srcObject=stream;await v.play();$("camBtn").style.display="none";
  const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
  scanTimer=setInterval(()=>{if(!v.videoWidth||!window.jsQR)return;cv.width=320;cv.height=Math.round(320*v.videoHeight/v.videoWidth);cx.drawImage(v,0,0,cv.width,cv.height);
   const r=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);if(r)onQR(r.data)},250);
 }catch(e){toast("カメラが使えませんでした（テストボタンで試せます）")}
}
function stopCam(){clearInterval(scanTimer);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function todayKey(){const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")}
function onQR(txt){
 const m=/^HM:(\d+):(\d{8})$/.exec(txt);stopCam();
 if(!m){toast("このアプリのQRではありません");rScan();return}
 const s=SHOPS.find(x=>x.id==m[1]);if(!s){toast("お店が見つかりません");rScan();return}
 if(m[2]!==todayKey()){openSheet("badqr");return}
 scanned(s,true);
}
function scanned(s,good){
 haptic();stopCam();
 const vp=visitPt(s),wp=good?walkPt(s):0,total=vp+wp;
 S.lastScan={s,good,vp,wp,total};
 S.pending+=total;
 const d=now();S.hist.unshift({t:s.n,d:(s.cat==="飲食"?(isNight()?"夜の来店":"昼の来店"):"来店")+(good?"＋歩いて来店":"（歩いて来店は無効）"),at:`${d.getMonth()+1}/${d.getDate()} ${hm(mins(d))}`,p:total,st:"wait",left:3,warn:good?0:1});
 openSheet("scan");if(good)setTimeout(confetti,500);
}

 <div class="hd" style="min-height:0;margin-bottom:8px"><button class="back press" onclick="closeShop()">‹ 戻る</button><span class="note">${s.cat==="飲食"?(isNight()?"夜":"昼")+"のポイント":"いつでも同じポイント"}</span></div>
 <div class="photo"><div class="ph" style="background:linear-gradient(135deg,${PAL[s.cat][0]},${PAL[s.cat][1]})">${s.e}</div><div class="lab">写真（仮）</div>
  <div class="stat">${o.open?'<span class="live"></span><span class="op">営業中</span>・'+hm(o.until)+'まで':'<span class="cl">準備中</span>・'+o.next}</div>
  <button class="fav press ${S.favs[id]?'on':''}" id="favb" onclick="toggleFav(${id})">${S.favs[id]?'❤️':'🤍'}</button></div>
 <h1 class="in">${s.n}</h1><div class="meta in" style="animation-delay:40ms">${s.g}・${s.a}・ここから${f.txt}（${(f.d/1000).toFixed(1)}km）</div>
 <div class="ptbox in" style="animation-delay:80ms"><div class="mo"><small>来店ポイント</small><b>+<span id="sp1">0</span>pt</b></div><div class="mg"><small>🚶 歩いて来たら</small><b>+<span id="sp2">0</span>pt</b></div></div>
 <div class="sec in" style="animation-delay:120ms"><h2>おすすめメニュー</h2></div>
 <div class="menu2 in" style="animation-delay:140ms">${s.m.map(m=>`<div>${m[0]}<small>${m[1]}</small></div>`).join("")}</div>
 <button class="hours in" style="animation-delay:170ms" onclick="this.classList.toggle('open')"><div class="hrow today"><span>営業時間（今日）</span><span>${s.off.includes(w)?"定休日":s.h.map(r=>hm(r[0])+"〜"+(r[1]>1440?"翌":"")+hm(r[1])).join("／")} ▾</span></div><div class="wk">${rows}</div></button>
 <div class="row in" style="margin-top:auto;animation-delay:200ms"><a class="btn bg press" style="text-decoration:none" href="https://maps.apple.com/?daddr=${s.lat},${s.lng}&dirflg=w" target="_blank" rel="noopener">🚶 歩いて行く</a><button class="btn bw press" onclick="openSheet('video')">▶ お店の動画</button></div>`;
 $("s-shop").classList.add("on");paintTabs();
 setTimeout(()=>{countUp($("sp1"),visitPt(s),700);countUp($("sp2"),visitPt(s)+walkPt(s),900)},250);
}
function closeShop(quick){S.shop=null;$("s-shop").classList.remove("on");paintTabs()}
function toggleFav(id){S.favs[id]=!S.favs[id];save();const b=$("favb");b.textContent=S.favs[id]?"❤️":"🤍";b.classList.remove("on");void b.offsetWidth;b.classList.add("on");haptic();toast(S.favs[id]?"お気に入りに入れました":"お気に入りから外しました")}

/* ===== 下から出る画面 ===== */
let payTimer;
function openSheet(k){
 const sh=$("sheet");let h="";const s=SHOPS.find(x=>x.id===(S.shop||S.paying));
 if(k==="scan"){const L=S.lastScan;h=`
  <div class="ok-anim ${L.good?'':'bad'}"><svg viewBox="0 0 90 90"><circle cx="45" cy="45" r="38"/><path d="${L.good?'M28 46l12 12 22-25':'M45 26v24M45 62v2'}"/></svg><div class="gain">+<span id="gain">0</span>pt</div><div class="note">${L.s.n}・確定待ちに入りました</div></div>
  ${[[L.s.cat==="飲食"?(isNight()?"夜の来店":"昼の来店"):"来店","+"+L.vp+"pt",1],["今日のQR","有効 ✓",1],["端末の確認（1台1アカウント）","OK ✓",1],
    ["歩数とGPSの距離",L.good?"一致 ✓（1.2km・1,640歩）":"合わない ✕",L.good],["移動の速さ",L.good?"徒歩 ✓（時速4.6km）":"速すぎる ✕（時速38km）",L.good],["歩いて来店",L.good?"+"+L.wp+"pt":"付きません",L.good]]
   .map((r,i)=>`<div class="ck" style="animation-delay:${700+i*130}ms">${r[0]}<b class="${r[2]?'':'bad'}">${r[1]}</b></div>`).join("")}
  <p class="note" style="margin:12px 0 14px">${nl(L.good?"ポイントは3日後に確定します。来店ポイントは1日1回までです。":"車やバスでの移動と判断したため、歩いて来店のポイントは付きません。来店のポイントは付きます。")}</p>`;
  setTimeout(()=>countUp($("gain"),L.total,900),600)}
 if(k==="badqr"){h=`<div class="ok-anim bad"><svg viewBox="0 0 90 90"><circle cx="45" cy="45" r="38"/><path d="M45 26v24M45 62v2"/></svg></div><h3 style="text-align:center">${nl("このQRは今日のものではありません。")}</h3><p class="note" style="text-align:center;margin-bottom:14px">${nl("QRは毎日変わります。お店の人に今日のQRを出してもらってください。")}</p>`}
 if(k==="pay"){h=`<h3>${s.n}で使う</h3>
  <div class="amt"><button class="press" onclick="chAmt(-100)">−</button><b><span id="amt">${fmt(S.amt)}</span>pt</b><button class="press" onclick="chAmt(100)">＋</button></div>
  <div class="chips" style="justify-content:center">${[100,500,1000].map(v=>`<button class="chip" onclick="S.amt=Math.min(${v},S.pt);$('amt').textContent=fmt(S.amt)">${v}pt</button>`).join("")}<button class="chip" onclick="S.amt=S.pt;$('amt').textContent=fmt(S.amt)">全部</button></div>
  <p class="note" style="margin-bottom:12px;text-align:center">${nl("使えるポイント "+fmt(S.pt)+"pt。お会計の前に金額を決めてください。")}</p>
  <button class="btn bo press" onclick="openSheet('paycode')">この金額で使う</button><div style="height:8px"></div>`}
 if(k==="paycode"){h=`<h3>${nl("店員さんにこの画面を見せてください。")}</h3>
  <div class="paycode"><div class="t">${s.n}</div><div class="v">${fmt(S.amt)}pt</div><div class="t">＝ ${fmt(S.amt)}円引き</div><div class="timer" id="ptimer">残り 5:00</div></div>
  <p class="note" style="margin-bottom:12px">${nl("画面の色が動いているのが本物の印です（スクショ対策）。")}</p>
  <button class="btn bk press" onclick="usePt()">使用済みにする（店員さんが押す）</button><div style="height:8px"></div>`;
  let left=300;clearInterval(payTimer);payTimer=setInterval(()=>{left--;const e=$("ptimer");if(!e||left<0){clearInterval(payTimer);return}e.textContent="残り "+Math.floor(left/60)+":"+String(left%60).padStart(2,"0")},1000)}
 if(k==="video"){const v=SHOPS.find(x=>x.id===S.shop);h=`<h3>${v.n}</h3>
  <div class="video"><div class="ph" style="background:linear-gradient(160deg,${PAL[v.cat][0]},${PAL[v.cat][1]})">${v.e}</div><div class="prog"><i></i></div>
  <div class="cap">${nl(v.a+"の"+v.g+"。おすすめは「"+v.m[0][0]+"」。")}<br><span style="font-size:11px;font-weight:600;opacity:.8">お店の紹介動画（制作1本1万円）</span></div></div>`}
 if(k==="rule"){h=`<h3>ポイントのルール</h3>
  ${[["飲食：夜の来店（17時〜）","+100pt"],["飲食：昼の来店","+25pt"],["飲食：歩いて来店（夜／昼）","+50／+10pt"],["美容・癒し：来店","+100pt（仮）"],["美容・癒し：歩いて来店","+50pt（仮）"],["普段の歩数","4,000歩ごと+1pt"],["1日の上限","来店1回・歩数+5pt"],["確定まで","3日"]].map((r,i)=>`<div class="ck" style="animation-delay:${i*60}ms">${r[0]}<b>${r[1]}</b></div>`).join("")}
  <p class="note" style="margin:12px 0 14px">${nl("来店はお店のQR（毎日変わります）で確認します。歩数とGPSの移動距離が合わない時や、移動が速すぎる時は、歩いて来店のポイントは付きません。1pt＝1円で協賛店で使えます。")}</p>`}
 if(k==="terms"){h=`<h3>同意内容</h3><p class="note" style="margin-bottom:14px;font-size:13px">${nl("位置情報と歩数は、ポイントを付けることと不正の確認に使います。個人が特定できない形に集計した位置データを、地域のお店や自治体などの第三者に提供・販売することがあります。広告用のSDKを使ってデータを売ることはしません。")}</p>`}
 if(k==="steps"){h=`<h3>今日の歩数</h3><div class="ck" style="animation-delay:0ms">歩数<b>6,214歩</b></div><div class="ck" style="animation-delay:60ms">GPSの移動距離<b>4.3km</b></div><div class="ck" style="animation-delay:120ms">歩数ポイント（今日）<b>+1pt</b></div><div class="ck" style="animation-delay:180ms">次の+1ptまで<b>あと1,786歩</b></div>
  <p class="note" style="margin:12px 0 14px">${nl("歩数とGPSの距離が大きくずれている時間は、歩数ポイントに数えません。")}</p>`}
 if(k==="testqr"){const t=nearestOpen();h=`<h3>テスト用：${t.n}の今日のQR</h3><div class="qrbox" id="qrbox"></div><p class="note" style="margin-bottom:14px;text-align:center">${nl("別のスマホでこのページを開き、スキャン画面のカメラで読み取ると試せます。")}</p>`;
  setTimeout(()=>{try{const q=qrcode(0,"M");q.addData("HM:"+t.id+":"+todayKey());q.make();$("qrbox").innerHTML=q.createImgTag(6,8)}catch(e){$("qrbox").textContent="QRを作れませんでした"}},50)}
 if(k==="time"){h=`<h3>時刻を変えて試す</h3><p class="note" style="margin-bottom:10px">${nl("営業中のお店や昼・夜のポイントが変わるのを試せます。")}</p>
  <div class="chips" style="flex-wrap:wrap">${[[null,"今の時刻"],[8,"朝 8:00"],[12,"昼 12:00"],[15,"15:00"],[19,"夜 19:00"],[23,"23:00"],[2,"深夜 2:00"]].map(([v,l])=>`<button class="chip ${S.time===v?'on':''}" onclick="S.time=${v};closeSheet();rMy();toast('${l}にしました')">${l}</button>`).join("")}</div>`}
 if(k==="icon"){h=`<h3>アプリアイコン案</h3><div class="icons">${ICONS.map(i=>`<div>${i[1]}${i[0]}</div>`).join("")}</div><p class="note" style="margin-bottom:14px">${nl("今のホーム画面のアイコンはAです。")}</p>`}
 const noClose=["pay","paycode"].includes(k);
 sh.innerHTML=`<div class="grab"></div>${h}${noClose?'':`<button class="btn ${k==='scan'?'bg':'bw'} press" onclick="closeSheet()">${k==='scan'?'OK':'閉じる'}</button>`}`;
 $("dim").classList.add("on");
}
function closeSheet(){$("dim").classList.remove("on");clearInterval(payTimer)}
$("dim").addEventListener("click",e=>{if(e.target.id==="dim")closeSheet()});
(function(){let y0=null;const sh=$("sheet");sh.addEventListener("touchstart",e=>{if(sh.scrollTop<=0)y0=e.touches[0].clientY},{passive:true});
 sh.addEventListener("touchmove",e=>{if(y0===null)return;const dy=e.touches[0].clientY-y0;if(dy>0){sh.style.transition="none";sh.style.transform=`translateY(${dy}px)`}},{passive:true});
 sh.addEventListener("touchend",e=>{if(y0===null)return;const dy=e.changedTouches[0].clientY-y0;sh.style.transition="";sh.style.transform="";y0=null;if(dy>110)closeSheet()})})();
function chAmt(d){haptic();S.amt=Math.max(100,Math.min(S.pt,S.amt+d));$("amt").textContent=fmt(S.amt)}
function usePt(){const s=SHOPS.find(x=>x.id===S.paying);const from=S.pt;S.pt-=S.amt;const d=now();
 S.hist.unshift({t:"使った："+s.n,d:"お会計で使用",at:`${d.getMonth()+1}/${d.getDate()} ${hm(mins(d))}`,p:-S.amt,st:"ok"});closeSheet();toast(fmt(S.amt)+"pt使いました");setTimeout(rPt,250)}

/* ===== アイコン案（背景は黒） ===== */
const BK=id=>`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E1E1E"/><stop offset="1" stop-color="#101010"/></linearGradient></defs><rect width="100" height="100" fill="url(#${id})"/>`;
const ICONS=[
 ["A：ピン＋足あと",`<svg viewBox="0 0 100 100">${BK("i1")}<path d="M50 88C33 67 22 55 22 40a28 28 0 0 1 56 0c0 15-11 27-28 48z" fill="#3FA86F"/><ellipse cx="45" cy="45" rx="7" ry="10.5" fill="#F0A030"/><circle cx="40" cy="30" r="3" fill="#F0A030"/><circle cx="46.5" cy="28" r="3" fill="#F0A030"/><circle cx="52.5" cy="31" r="2.6" fill="#F0A030"/><ellipse cx="58" cy="52" rx="5.5" ry="8" fill="#F0A030" opacity=".55"/></svg>`],
 ["B：歩く道＋Pコイン",`<svg viewBox="0 0 100 100">${BK("i2")}<path d="M16 84C30 62 58 72 68 42" stroke="#3FA86F" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="2 12"/><circle cx="68" cy="34" r="17" fill="#F0A030"/><path d="M63 44V25h6a5 5 0 0 1 0 10h-6" stroke="#1E1E1E" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`],
 ["C：お店の屋根＋足あと",`<svg viewBox="0 0 100 100">${BK("i3")}<path d="M18 40h64l-6-16H24z" fill="#3FA86F"/><path d="M18 40c0 6 8 6 8 0 0 6 8 6 8 0 0 6 8 6 8 0 0 6 8 6 8 0 0 6 8 6 8 0 0 6 8 6 8 0 0 6 8 6 8 0" fill="#3FA86F"/><rect x="24" y="48" width="52" height="32" rx="3" fill="#3FA86F" opacity=".35"/><ellipse cx="50" cy="66" rx="6" ry="9" fill="#F0A030"/><circle cx="45.5" cy="53.5" r="2.6" fill="#F0A030"/><circle cx="51" cy="52" r="2.6" fill="#F0A030"/><circle cx="56" cy="54.5" r="2.2" fill="#F0A030"/></svg>`],
];

/* ===== 最初の同意（3枚） ===== */
S.cstep=0;S.ag=[0,0,0];S.perm=[0,0];
function showConsent(){
 const c=$("consent");c.classList.remove("out");c.style.display="block";
 const items=[["利用規約とプライバシーポリシーに同意します",""],["位置情報と歩数を、ポイントを付けることと不正の確認に使うことに同意します",""],["個人が特定できない形に集計した位置データを、第三者に提供・販売することがあることに同意します","地域のお店や自治体などに提供します。広告用のSDKでデータを売ることはしません。"]];
 const all=S.ag.every(Boolean);
 c.innerHTML=`<div class="steps" style="transform:translateX(-${S.cstep*33.3333}%)">
 <div class="step">
  <div class="hero"><svg class="lg" viewBox="0 0 100 100">${ICONS[0][1].replace(/^<svg[^>]*>|<\/svg>$/g,"").replace(/i1/g,"c1")}</svg>
   ${["15%,70%","24%,52%","72%,30%","80%,50%"].map((p,i)=>`<span class="fp" style="left:${p.split(",")[0]};top:${p.split(",")[1]};animation-delay:${i*.6}s">👣</span>`).join("")}</div>
  <h1>歩いて、出かけて、<br>ポイントが貯まる。</h1>
  <p class="lead">${nl("東三河の個人のお店だけを集めました。飲食店も、ネイルやマッサージも。お店に行くとポイント、歩いて行くともっとポイント。1pt＝1円で協賛店で使えます。")}</p>
  <div style="margin-top:auto"><div class="pager"><i class="on"></i><i></i><i></i></div><button class="btn bg press" onclick="S.cstep=1;showConsent()">はじめる</button></div>
 </div>
 <div class="step">
  <h1>使う機能を<br>許可してください</h1><p class="lead">${nl("ポイントを正しく付けるために使います。あとから設定で変えられます。")}</p>
  <div class="perm"><div class="ic mg">📍</div><div class="tx"><b>位置情報</b><small>${nl("歩いて来店したかの確認に使います。")}</small></div><button class="sw ${S.perm[0]?'done':''}" onclick="askPerm(0)">${S.perm[0]?'許可済み':'許可する'}</button></div>
  <div class="perm"><div class="ic mo">👟</div><div class="tx"><b>歩数（ヘルスケア）</b><small>${nl("普段の歩数ポイントと、GPSとの照らし合わせに使います。")}</small></div><button class="sw ${S.perm[1]?'done':''}" onclick="askPerm(1)">${S.perm[1]?'許可済み':'許可する'}</button></div>
  <div class="perm"><div class="ic" style="background:#F1F1F1">📱</div><div class="tx"><b>端末の確認</b><small>${nl("1台1アカウントにするため、端末を確認します（DeviceCheck）。")}</small></div><span class="note">自動</span></div>
  <div style="margin-top:auto"><div class="pager"><i></i><i class="on"></i><i></i></div><div class="row"><button class="btn bw press sm" onclick="S.cstep=0;showConsent()">戻る</button><button class="btn bg press" onclick="S.cstep=2;showConsent()">次へ</button></div></div>
 </div>
 <div class="step">
  <h1>同意の確認</h1><p class="lead">${nl("すべてにチェックすると始められます。")}</p>
  ${items.map((t,i)=>`<button class="agree ${S.ag[i]?'on':''}" onclick="S.ag[${i}]=S.ag[${i}]?0:1;haptic();showConsent()"><span class="box">${S.ag[i]?'✓':''}</span><span>${t[0]}${t[1]?`<small>${t[1]}</small>`:""}</span></button>`).join("")}
  <button class="note" style="text-align:left;margin-top:8px;text-decoration:underline" onclick="S.ag=[1,1,1];showConsent()">すべてに同意する</button>
  <div style="margin-top:auto"><div class="pager"><i></i><i></i><i class="on"></i></div><div class="row"><button class="btn bw press sm" onclick="S.cstep=1;showConsent()">戻る</button><button class="btn bg press" ${all?'':'disabled'} onclick="finishConsent()">同意してはじめる</button></div></div>
 </div></div>`;
}
function askPerm(i){haptic();if(i===0&&navigator.geolocation){navigator.geolocation.getCurrentPosition(()=>{},()=>{},{timeout:5000})}S.perm[i]=1;showConsent()}
function finishConsent(){S.consent=true;try{localStorage.setItem("hm_consent","1")}catch(e){};haptic();$("consent").classList.add("out");setTimeout(()=>{$("consent").style.display="none"},500);S.tab="";go("home");setTimeout(confetti,300)}

/* ===== はじめ ===== */
function boot(){
 if(!S.consent){showConsent();}else{$("consent").style.display="none"}
 S.tab="";go("home");
 window.addEventListener("resize",paintTabs);
}
boot();
// ホーム画面に追加したアプリでも、新しい版をすぐ反映する
function checkVer(){fetch("version.txt?t="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(v=>{if(v.trim()&&v.trim()!==VERSION)location.reload()}).catch(()=>{})}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){checkVer();if(S.tab==="home")rHome()}});
checkVer();
</script>
