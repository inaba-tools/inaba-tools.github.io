name: kabu-drop data
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch IPO / PO lists
        run: |
          set -e
          UA="Mozilla/5.0"
          curl -sfL -A "$UA" https://www.rakuten-sec.co.jp/web/domestic/ipo/json/ipo_lead_json.json -o /tmp/ipo.json
          curl -sfL -A "$UA" https://www.rakuten-sec.co.jp/web/domestic/ipo/json/po_lead_json.json -o /tmp/po.json
          python3 -c "import json;json.load(open('/tmp/ipo.json'));json.load(open('/tmp/po.json'))"
          cp /tmp/ipo.json kabu-drop/data/ipo.json
          cp /tmp/po.json kabu-drop/data/po.json
      - name: Fetch 分売 / 株価 / 会社名
        run: |
          pip install -q openpyxl pywebpush
          python3 kabu-drop/tools/fetch.py
      - name: 通知を送る
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
        run: python3 kabu-drop/tools/notify.py || true
      - name: Commit if changed
        run: |
          git config user.name "kabu-drop-bot"
          git config user.email "noreply@anthropic.com"
          git add kabu-drop/data
          git diff --cached --quiet && exit 0
          date -u +%Y-%m-%dT%H:%M:%SZ > kabu-drop/data/updated.txt
          git add kabu-drop/data
          git commit -m "kabu-drop: データ更新"
          git push
