name: kabu-drop data
# KABU DROPの通知だけ。データは大元（kabu-data）の更新が終わった後に読む
on:
  workflow_run:
    workflows: ['kabu data']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kabu-drop
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 通知を送る
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          KD_NOTIFY_KEY: ${{ secrets.KD_NOTIFY_KEY }}
        run: |
          for i in 1 2 3; do pip install -q pywebpush==2.5.0 && break; sleep 20; done
          python3 kabu-drop/tools/notify.py || true
      - name: 送った記録を保存
        run: |
          git config user.name "kabu-drop-bot"
          git config user.email "noreply@anthropic.com"
          git add kabu-drop/data
          git diff --cached --quiet && exit 0
          git commit -m "kabu-drop: 通知の記録"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
