name: kabu data
# 株データの大元（kabu-data）：IPO・PO・分売・初値予想・株価を3時間ごとに集める
# KABU DROP・フクリはどちらもここを読みにいく（どちらかを止めても、もう一方は動く）
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kabu-drop
  cancel-in-progress: false
jobs:
  # 外のサイトからデータを取るジョブ：読み取り権限のみ・合い鍵（Secrets）なし
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: IPO・POの一覧
        run: |
          set -e
          UA="Mozilla/5.0"
          get() { curl -sfL --retry 3 --retry-delay 20 --retry-all-errors -A "$UA" "$1" -o "$2"; }
          get https://www.rakuten-sec.co.jp/web/domestic/ipo/json/ipo_lead_json.json /tmp/ipo.json
          get https://www.rakuten-sec.co.jp/web/domestic/ipo/json/po_lead_json.json /tmp/po.json
          python3 -c "import json;json.load(open('/tmp/ipo.json'));json.load(open('/tmp/po.json'))"
          cp /tmp/ipo.json kabu-data/ipo.json
          cp /tmp/po.json kabu-data/po.json
      - name: 分売・株価・会社名・初値予想
        run: |
          for i in 1 2 3; do pip install -q openpyxl==3.1.5 && break; sleep 20; done
          python3 kabu-data/tools/fetch.py || (sleep 60 && python3 kabu-data/tools/fetch.py)
      - uses: actions/upload-artifact@v4
        with:
          name: kabu-data
          path: kabu-data
          retention-days: 1

  # 保存のジョブ：外のサイトには触らない
  save:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kabu-data
          path: kabu-data
      - name: 変わっていたら保存
        run: |
          git config user.name "kabu-data-bot"
          git config user.email "noreply@anthropic.com"
          git add kabu-data
          git diff --cached --quiet && exit 0
          date -u +%Y-%m-%dT%H:%M:%SZ > kabu-data/updated.txt
          git add kabu-data
          git commit -m "kabu-data: データ更新"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
