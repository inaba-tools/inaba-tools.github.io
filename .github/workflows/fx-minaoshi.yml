name: fx-minaoshi
# 型の見直し：時刻・損切り幅・条件を変えた全部の組み合わせを年ごとに計算（重いので研究用）
on:
  workflow_dispatch:
  push:
    paths:
      - 'fx-kiroku/kenkyu/go-minaoshi.txt'
permissions:
  contents: write
jobs:
  minaoshi:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        year: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - name: 1年分の設定を全部計算
        run: |
          pip install -q holidays==0.108
          python3 fx-kiroku/kenkyu/minaoshi.py ${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        with:
          name: minaoshi-${{ matrix.year }}
          path: fx-kiroku/kenkyu/data/minaoshi_${{ matrix.year }}.csv
  matome:
    needs: minaoshi
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: fx-kiroku/kenkyu/data
          merge-multiple: true
      - name: Commit
        run: |
          git config user.name "fx-kiroku-bot"
          git config user.email "noreply@anthropic.com"
          git add fx-kiroku/kenkyu/data
          git diff --cached --quiet && exit 0
          git commit -m "fx-kenkyu: 型の見直し（設定ごとの結果）"
          git pull --rebase
          git push
