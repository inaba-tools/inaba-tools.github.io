name: uk render
on:
  push:
    paths: ['uk/cards/**', 'uk/render.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: uk-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          for i in 1 2 3; do pip install -q playwright && break; sleep 20; done
      - name: Render
        run: |
          export CHROME=/usr/bin/google-chrome
          for i in 1 2; do python3 uk/render.py && break; sleep 15; done
      - name: Commit
        run: |
          git config user.name "uk-bot"
          git config user.email "noreply@anthropic.com"
          git add uk/img
          git diff --cached --quiet && exit 0
          git commit -q -m "uk: images"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
