name: fx-kiroku
on:  # 2026-11-06 定時実行を止めた（FXタブは練習botの記録に切り替え）。手動でだけ動かせる
  workflow_dispatch:
  push:
    paths:
      - 'fx-kiroku/run.py'   # 型の設定を変えたらすぐ記録をやり直す
permissions:
  contents: write
jobs:
  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 前日分を判定して記録
        run: |
          pip install -q holidays==0.108
          python3 fx-kiroku/run.py
      - name: 今日の情勢（金利差・VIX・発表日・ニュースの明るさ）
        run: |
          cd fx-kiroku/kenkyu
          python3 jousei.py || echo "情勢データの取得に失敗（前回のまま）"
          python3 kyou.py || echo "今日の情勢の作成に失敗（前回のまま）"
      - name: Commit if changed
        run: |
          git config user.name "fx-kiroku-bot"
          git config user.email "noreply@anthropic.com"
          git add fx-kiroku/kiroku.csv fx-kiroku/kenkyu/jousei.csv fx-kiroku/kenkyu/kyou.json fx-kiroku/kenkyu/data/gdelt_*.csv
          git diff --cached --quiet && exit 0
          git commit -m "fx-kiroku: 仮想トレードを記録"
          git pull --rebase
          git push
